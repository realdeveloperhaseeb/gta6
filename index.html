*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#07060f;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#f3eefc;user-select:none}
canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh}#c{cursor:crosshair}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(180deg,rgba(20,6,46,.86),rgba(84,16,82,.72) 55%,rgba(255,120,60,.45));z-index:5}
#ov.hide{display:none}
#panel{width:min(620px,92vw);max-height:92vh;overflow:auto;padding:34px 38px;border-radius:6px;
 background:rgba(9,7,22,.9);border:1px solid rgba(255,70,200,.45);box-shadow:0 0 0 1px rgba(40,230,255,.15),0 30px 80px rgba(0,0,0,.6)}
h1{font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;font-style:italic;font-weight:400;font-size:clamp(52px,9vw,88px);line-height:.9;letter-spacing:2px;
 background:linear-gradient(180deg,#ffe36b 0%,#ff7a3d 45%,#ff2bd6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 14px rgba(255,43,214,.55))}
h2{font-family:Impact,"Arial Narrow Bold",sans-serif;font-style:italic;font-weight:400;font-size:34px;letter-spacing:1px;color:#22e6ff;margin-bottom:14px}
.tag{color:#22e6ff;letter-spacing:5px;font-size:12px;text-transform:uppercase;margin:10px 0 24px}
button{display:block;width:100%;margin:9px 0;padding:13px 18px;font:700 16px "Trebuchet MS",sans-serif;letter-spacing:2px;text-transform:uppercase;text-align:left;
 color:#fff;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);border-left:4px solid #ff2bd6;border-radius:3px;cursor:pointer}
button:hover,button:focus-visible{background:rgba(255,43,214,.22);border-left-color:#22e6ff;outline:none}
button:disabled{opacity:.35;cursor:not-allowed}
button small{float:right;color:#ffe36b;letter-spacing:0;font-size:14px}
p,li{line-height:1.55;color:#d6cfe8;font-size:15px}
ul{list-style:none;margin:6px 0 16px}
kbd{display:inline-block;min-width:26px;text-align:center;padding:1px 7px;margin-right:6px;border:1px solid #7a6f9a;border-bottom-width:3px;border-radius:4px;color:#fff;font:700 12px monospace;background:#1b1730}
.credit{margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#a79fc0}
a{color:#ffe36b;font-weight:700;text-decoration:none}a:hover{text-decoration:underline}
.big{font-size:19px;color:#fff;margin:8px 0}
.row{display:flex;gap:10px}.row button{text-align:center}
.hero{display:flex;align-items:center;gap:14px;margin:0 0 18px}.hero img{width:64px;height:64px;border-radius:50%;border:2px solid #fff;object-fit:cover}.hero small{display:block;color:#ffb86b;letter-spacing:3px;font-size:11px}.hero b{font:italic 30px Impact,sans-serif;letter-spacing:1px;color:#fff}</style>

  try{localStorage.setItem(SAVE_KEY,JSON.stringify({money:S.money,done:S.done,cp:S.mission?S.mission.cp:0,own:P.own,ammo:P.ammo,gren:P.gren,armor:P.armor,w:P.w,stats:S.stats,tod:S.tod}));}catch(e){}
}
function newState(sv){
  sv=sv||{};
  S={t:0,tod:sv.tod||16.6,money:sv.money==null?500:sv.money,done:sv.done||0,cpSaved:sv.cp||0,
     stats:Object.assign({kills:0,stolen:0,dist:0,time:0,busted:0,ko:0,booms:0},sv.stats||{}),
     wanted:0,heat:0,unseen:0,arrestT:0,notes:[],banner:null,mission:null,dead:null,paused:false,
     spT:0,copT:0,saveT:20,hit:0,shake:0,sprayT:0,map:false,lights:[],intro:null,ending:null,base:{},prompt:''};
  P={x:12.5*T,y:23.5*T,alt:0,ang:-1.57,r:6,hp:100,armor:sv.armor||0,car:null,w:sv.w||0,own:sv.own||[1,0,0,0,0,0],ammo:sv.ammo||[0,0,0,0,0,0],gren:sv.gren||0,
     cool:0,gcool:0,walk:0,punch:0,aimT:0,moving:0,hurtT:0,col:'#3b3b44',pants:'#22232a',skin:'#c58f6b',kind:'player',hair:5};
  cars=[];peds=[];bullets=[];parts=[];picks=[];shots=[];decals=[];
  cam.x=P.x;cam.y=P.y;cam.alt=0;cam.yaw=-1.57;cam.pitch=.3;cam.dist=80;
  ensureBase();
  for(let i=0;i<50;i++){trySpawnTraffic(true);trySpawnPed(true);}
}
function note(t){S.notes.push({t,life:7});if(S.notes.length>4)S.notes.shift();}
function banner(a,b,col){S.banner={a,b,col:col||'#ffe36b',life:4.5};}

/* ---------------- entities ---------------- */
function mkCar(type,x,y,ang){
  const c={type,x,y,ang,v:0,alt:0,vz:0,pitch:0,roll:0,rotor:0,turret:ang,hp:CT[type].hp,
    col:type==='police'?'#e9eaee':type==='taxi'?'#e0b312':type==='truck'?'#2a2d33':type==='tank'?'#4a5238':type==='heli'?'#2b3138':type==='jet'?'#8b9199':pick(CARCOL),
    ai:null,cop:false,dead:false,mission:false,burn:0,brake:false,keep:false,enemy:false,cool:0};
  cars.push(c);return c;
}
function ensureBase(){
  for(const k in BASE){const c=S.base[k];
    if(!c||c.dead||!cars.includes(c)){const b=BASE[k],n=mkCar(k,b[0]*T,b[1]*T,b[2]);n.keep=true;S.base[k]=n;}}
}
function mkPed(kind,x,y){
  const p={kind,x,y,ang:rnd(0,6.28),d:Math.random()*4|0,hp:kind==='civ'?40:kind==='cop'?75:60,
    col:kind==='cop'?'#1f2c4d':kind==='gang'?'#5b2a86':pick(SHIRT),pants:kind==='cop'?'#161b2b':kind==='gang'?'#15151a':pick(PANTS),skin:pick(SKIN),
    hair:kind==='cop'?3:kind==='gang'?4:Math.random()*3|0,
    walk:rnd(0,6),panic:0,cool:rnd(.8,1.8),seed:rnd(0,9),sideT:0,side:0,dead:false,deadT:0,leave:6,moving:1};
  peds.push(p);return p;
}
/* particles (3D): a=1 alpha-blended (smoke), a=0 additive (fire) */
function part(x,y,z,vx,vy,vz,life,s0,s1,r,g,b,a,grav){if(parts.length<900)parts.push({x,y,z,vx,vy,vz,life,max:life,s0,s1,r,g,b,a,grav:grav||0});}
function spark(x,y,col,n,sp,z){const c=hex(col);for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(.2,1)*sp;part(x,y,(z==null?9:z),Math.cos(a)*s,Math.sin(a)*s,rnd(20,120),rnd(.2,.55),1.6,.3,c[0]*1.6,c[1]*1.6,c[2]*1.6,0,300);}}
function blood(x,y,z){for(let i=0;i<6;i++){const a=rnd(0,6.28),s=rnd(10,70);part(x,y,z,Math.cos(a)*s,Math.sin(a)*s,rnd(10,70),rnd(.3,.6),1.2,2.4,.5,.02,.03,1,260);}}
function smoke(x,y,z,n,sz,dark){for(let i=0;i<n;i++){const k=dark?rnd(.1,.2):rnd(.4,.55);part(x+rnd(-4,4),y+rnd(-4,4),z+rnd(0,4),rnd(-12,12),rnd(-12,12),rnd(20,55),rnd(1.2,2.6),sz*.5,sz*2.2,k,k,k,1,0);}}
function fireball(x,y,z,s){
  for(let i=0;i<26;i++){const a=rnd(0,6.28),e=rnd(-.2,1.3),sp=rnd(20,150)*s;part(x,y,z+4,Math.cos(a)*Math.cos(e)*sp,Math.sin(a)*Math.cos(e)*sp,Math.sin(e)*sp+30,rnd(.35,.8),14*s,34*s,1.6,rnd(.5,.9),.12,0,-40);}
  for(let i=0;i<16;i++){const a=rnd(0,6.28),sp=rnd(10,70)*s;part(x,y,z+8,Math.cos(a)*sp,Math.sin(a)*sp,rnd(40,120)*s,rnd(1.6,3.4),16*s,62*s,.13,.12,.11,1,-10);}
  for(let i=0;i<22;i++){const a=rnd(0,6.28),sp=rnd(80,420)*s;part(x,y,z+4,Math.cos(a)*sp,Math.sin(a)*sp,rnd(60,380)*s,rnd(.5,1.2),1.6,.4,2,1.3,.4,0,520);}
}
function light(x,y,z,r,g,b,rad,life){S.lights.push({x,y,z,r,g,b,rad,life,max:life});}
const HEXC={};
function hex(h){let c=HEXC[h];if(c)return c;let s=h.slice(1);if(s.length===3)s=s[0]+s[0]+s[1]+s[1]+s[2]+s[2];const n=parseInt(s,16);return HEXC[h]=[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}

function trySpawnTraffic(near){
  const vr=near?260:1100;
  for(let k=0;k<8;k++){
    const i=Math.random()*8|0,j=Math.random()*8|0,d=Math.random()*4|0;
    if(!validDir(i,j,d))continue;
    const[x,y]=exitPt(i,j,d),dd=Math.hypot(x-P.x,y-P.y);
    if(dd<vr||dd>vr+(near?1500:750))continue;
    if(cars.some(c=>Math.hypot(c.x-x,c.y-y)<110))continue;
    const r=Math.random(),c=mkCar(r<.12?'sports':r<.26?'van':r<.4?'taxi':r<.45?'police':'sedan',x,y,d*Math.PI/2);
    c.ai={i,j,d,phase:0,wx:x+DX[d]*20,wy:y+DY[d]*20,stuck:0,direct:false};c.v=100;return c;
  }
  return null;
}
function trySpawnPed(near){
  const vr=near?80:520;
  for(let k=0;k<10;k++){
    const a=rnd(0,6.28),r=vr+rnd(0,near?1100:500),x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r,t=tile(Math.floor(x/T),Math.floor(y/T));
    if(y<CITYH*T&&(t===WALK||t===PARK||t===SAND))return mkPed('civ',x,y);
  }
  return null;
}
function spawnCopCar(){
  let best=null;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const x=(i*10+1)*T,y=(j*10+1)*T,d=Math.hypot(x-P.x,y-P.y);
    if(d>900&&d<1900&&(!best||Math.random()<.4))best={i,j,x,y};
  }
  if(!best)return;
  const c=mkCar('police',best.x,best.y,Math.atan2(P.y-best.y,P.x-best.x));
  c.cop=true;c.ai={i:best.i,j:best.j,d:0,phase:1,wx:best.x,wy:best.y,stuck:0,direct:false};
}
function reanchor(c){const a=c.ai;a.i=clamp(Math.round((c.x/T-1)/10),0,7);a.j=clamp(Math.round((c.y/T-1)/10),0,7);a.phase=1;a.wx=(a.i*10+1)*T;a.wy=(a.j*10+1)*T;a.direct=false;}
function chooseDir(c){
  const a=c.ai,chase=c.cop&&S.wanted>0,back=(a.d+2)%4;
  let o=[0,1,2,3].filter(d=>validDir(a.i,a.j,d)&&(chase||d!==back));
  if(!o.length)o=[back];
  if(chase){const sc=d=>Math.hypot(((a.i+DX[d])*10+1)*T-P.x,((a.j+DY[d])*10+1)*T-P.y);o.sort((p,q)=>sc(p)-sc(q));return o[0];}
  if(o.includes(a.d)&&Math.random()<.55)return a.d;
  return pick(o);
}
function dismount(c){
  c.ai=null;c.v*=.3;
  for(const s of[1,-1]){const x=c.x+Math.cos(c.ang+s*1.57)*24,y=c.y+Math.sin(c.ang+s*1.57)*24;
    if(!blocked(x,y,6))mkPed('cop',x,y);}
}

/* ---------------- crime & wanted ---------------- */
const HEAT=[0,1,3,6,10,16];
function crime(p){
  S.heat+=p;let w=0;for(let i=1;i<6;i++)if(S.heat>=HEAT[i])w=i;
  if(w>S.wanted){S.wanted=w;S.copT=0;snd(700,.25,'sawtooth',.05,400);}
  if(S.wanted>0)S.unseen=0;
}
function setWanted(l){if(!l)return clearWanted();S.heat=HEAT[l];S.wanted=l;S.unseen=0;S.copT=0;snd(700,.25,'sawtooth',.05,400);}
function clearWanted(){S.wanted=0;S.heat=0;S.unseen=0;S.arrestT=0;for(const p of peds)if(p.kind==='cop')p.leave=5;}
function updWanted(dt){
  if(!S.wanted){S.heat=Math.max(0,S.heat-dt*.04);return;}
  let seen=false,arrest=false;
  const heavy=P.car&&(CT[P.car.type].air||P.car.type==='tank'),high=P.alt>150;
  if(!high){
    for(const p of peds)if(p.kind==='cop'&&!p.dead){const d=dist(p,P);
      if(d<520&&los(p.x,p.y,P.x,P.y)){seen=true;if(!heavy&&d<(P.car?40:20)&&(!P.car||Math.abs(P.car.v)<25))arrest=true;}}
    if(!seen)for(const c of cars)if(c.cop&&c.ai&&!c.dead&&dist(c,P)<520&&los(c.x,c.y,P.x,P.y)){seen=true;break;}
  }
  if(seen)S.unseen=0;else{S.unseen+=dt;if(S.unseen>8+S.wanted*3){clearWanted();note('You lost the cops.');snd(520,.3,'triangle',.06,300);}}
  if(arrest){S.arrestT+=dt;if(S.arrestT>1.4)die('busted');}else S.arrestT=Math.max(0,S.arrestT-dt);
}

/* ---------------- combat ---------------- */
function fire(x,y,a,dmg,o){bullets.push({x,y,vx:Math.cos(a)*1000,vy:Math.sin(a)*1000,life:.5,dmg,o});}
function hurtPed(p,dmg,ang,byPlayer){
  if(p.dead)return;
  p.hp-=dmg;blood(p.x,p.y,12);moveEnt(p,Math.cos(ang)*4,Math.sin(ang)*4,5);
  if(p.kind==='civ')p.panic=7;
  if(byPlayer&&p.kind!=='gang')crime(p.kind==='cop'?2:.6);
  if(p.hp<=0){
    p.dead=true;p.deadT=25;p.ang=ang;
    if(byPlayer){S.stats.kills++;if(p.kind!=='gang')crime(p.kind==='cop'?3:1.4);}
    picks.push({x:p.x,y:p.y,amt:p.kind==='gang'?Math.round(rnd(80,160)):Math.round(rnd(8,60)),life:40});
  }
}
function damagePlayer(d){
  if(S.dead||S.ending||S.intro)return;
  if(P.armor>0){const a=Math.min(P.armor,d*.8);P.armor-=a;d-=a;}
  P.hp-=d;S.hit=.35;P.hurtT=5;sfxHit();
  if(P.hp<=0){P.hp=0;die('ko');}
}
let aimLock=false;
function aimAngle(){
  let best=null,bs=1e9;aimLock=false;
  for(const p of peds){if(p.dead)continue;const d=dist(p,P);if(d>480||d<4)continue;
    const df=Math.abs(angDiff(Math.atan2(p.y-P.y,p.x-P.x),P.ang));if(df>(p.kind==='civ'?.1:.28))continue;
    const sc=d*(1+df*4)*(p.kind==='civ'?2.5:1);if(sc<bs&&los(P.x,P.y,p.x,p.y)){bs=sc;best=p;}}
  if(best&&P.w>0&&P.w<5){aimLock=true;return Math.atan2(best.y-P.y,best.x-P.x);}
  return P.ang;
}
function alarm(){let w=false;for(const p of peds){if(p.dead||p.kind!=='civ')continue;if(dist(p,P)<460){p.panic=6;w=true;}}return w;}
function attack(){
  const w=WP[P.w];P.cool=w.rate;P.aimT=1.2;
  if(P.w===0){
    P.punch=.18;snd(140,.07,'triangle',.06,-60);
    for(const p of peds){if(p.dead)continue;
      if(dist(P,p)<24&&Math.abs(angDiff(Math.atan2(p.y-P.y,p.x-P.x),P.ang))<1.2){hurtPed(p,22,P.ang,true);break;}}
    return;
  }
  if(P.ammo[P.w]<=0){note('Out of ammo.');P.w=0;return;}
  P.ammo[P.w]--;
  const A=aimAngle(),mx=P.x+Math.cos(A)*11,my=P.y+Math.sin(A)*11;
  if(w.rocket){shots.push({k:'rocket',x:mx,y:my,z:13,vx:Math.cos(A)*900,vy:Math.sin(A)*900,vz:Math.sin(.6-cam.pitch)*260,life:2.2,o:'p'});sfxShot(5,P.x,P.y);smoke(P.x-Math.cos(A)*8,P.y-Math.sin(A)*8,13,4,5);}
  else{for(let i=0;i<w.pel;i++)fire(mx,my,A+rnd(-w.spread,w.spread),w.dmg,'p');sfxShot(P.w,P.x,P.y);cam.pitch=Math.max(.06,cam.pitch-(P.w===4?.02:.005));cam.yaw+=rnd(-.004,.004);if(P.w===4)S.shake=Math.max(S.shake,.18);}
  part(mx,my,13,0,0,0,.05,7,11,2,1.6,.7,0,0);light(mx,my,14,1,.8,.45,150,.06);
  if(alarm())crime(.22);
}
function throwGrenade(){
  if(P.car||P.gcool>0||S.dead)return;
  if(P.gren<=0){note('No grenades.');return;}
  P.gren--;P.gcool=.9;P.aimT=.6;P.punch=.25;
  const a=P.ang,up=clamp(.75-cam.pitch,.1,.9);
  shots.push({k:'gren',x:P.x+Math.cos(a)*6,y:P.y+Math.sin(a)*6,z:15,vx:Math.cos(a)*330,vy:Math.sin(a)*330,vz:120+up*260,life:2.3,o:'p'});
  snd(300,.12,'triangle',.05,-150);
}
function explodeAt(x,y,z,R,dmg,byP){
  const g=Math.max(z,0);
  fireball(x,y,g,R/110);light(x,y,g+30,1,.6,.25,R*5,.55);boom(.25+.75*near(x,y,2600));
  S.shake=Math.max(S.shake,.9*clamp(1-Math.hypot(x-P.x,y-P.y)/900,0,1));S.stats.booms++;
  if(z<40&&!isSea(x,y)){decals.push({x,y,r:R*.75,life:60});if(decals.length>24)decals.shift();}
  if(z<70)for(const p of peds){if(p.dead)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<R)hurtPed(p,dmg*(1-d/R)+25,Math.atan2(p.y-y,p.x-x),byP);else if(d<R*4&&p.kind==='civ')p.panic=8;}
  for(const c of cars){if(c.dead)continue;const d=Math.hypot(c.x-x,c.y-y,c.alt-z),rr=R+CT[c.type].rad;
    if(d<rr){c.hp-=dmg*1.7*(1-d/rr)+20;if(byP&&c.cop&&c.ai)crime(1);}}
  if(!P.car&&z<70){const d=Math.hypot(P.x-x,P.y-y);if(d<R)damagePlayer(dmg*.55*(1-d/R)+6);}
  if(byP)crime(1.2);
}
function explode(c){
  if(c.dead)return;
  c.dead=true;c.v=0;c.ai=null;c.vz=0;
  const wasIn=P.car===c,air=CT[c.type].air;
  explodeAt(c.x,c.y,c.alt+6,c.type==='tank'||air?170:130,90,false);
  if(wasIn){if(air&&(c.alt>gY(c.x,c.y)+30||isSea(c.x,c.y)||c.hp<-500)){P.car=null;P.alt=0;P.hp=0;die('ko');}else{exitCar(true);damagePlayer(c.type==='tank'?45:75);}}
}
function die(kind){
  if(S.dead)return;
  S.dead={t:3.6,kind};
  if(P.car){P.car.ai=null;P.car=null;}P.alt=0;
  if(kind==='busted')S.stats.busted++;else S.stats.ko++;
  snd(200,.8,'sawtooth',.08,-150);
}
function respawn(){
  const busted=S.dead.kind==='busted';
  S.dead=null;P.hp=100;P.alt=0;
  clearWanted();peds=peds.filter(p=>p.kind!=='cop');cars=cars.filter(c=>!c.cop);bullets=[];shots=[];
  if(S.mission){restartCP();return;}
  const pl=busted?PLACES[8]:PLACES[7],fee=Math.min(S.money,Math.round(S.money*.05)+100);
  S.money-=fee;P.x=pl.x*T;P.y=(pl.y+1.2)*T;
  note(busted?'Released on bail. Fee: $'+fee:'Patched up at the hospital. Bill: $'+fee);
  S.tod=(S.tod+3)%24;cam.x=P.x;cam.y=P.y;cam.alt=0;ensureBase();save();
}

/* ---------------- player & vehicles ---------------- */
function nearCar(){let b=null,bd=1e9;for(const c of cars){if(c.dead||c.hp<=0||c.enemy)continue;const d=dist(c,P)-CT[c.type].rad;if(d<26&&d<bd&&c.alt<gY(c.x,c.y)+12+bh(c.x,c.y)){bd=d;b=c;}}return b;}
function enterCar(){
  const c=nearCar();if(!c)return;
  if(c.ai){
    if(c.cop){crime(2);dismount(c);}
    else{crime(1);const d=mkPed('civ',c.x+Math.cos(c.ang+1.57)*26,c.y+Math.sin(c.ang+1.57)*26);d.panic=9;if(blocked(d.x,d.y,6)){d.x=c.x;d.y=c.y;}}
    S.stats.stolen++;
  }else if(!c.mission&&!c.owned&&!c.keep)S.stats.stolen++;
  c.ai=null;c.owned=true;P.car=c;sfxDoor();
  const t=c.type;
  if(t==='tank')note('TANK — W/S drive · A/D turn · mouse aims turret · click fires');
  else if(t==='heli')note('HELICOPTER — Space up · Shift down · W/S fly · A/D turn · click fires rockets');
  else if(t==='jet')note('JET — hold W for thrust · Space pulls up at speed · Shift nose down · A/D bank · click fires missiles');
}
function exitCar(force){
  const c=P.car;if(!c)return;
  const air=CT[c.type].air,g=gY(c.x,c.y)+(bh(c.x,c.y)?bh(c.x,c.y)-3:0);
  if(!force){
    if(air&&c.alt>g+2){note('Land before getting out.');return;}
    if(Math.abs(c.v)>200){note('Slow down to bail out.');return;}
  }
  const rr=CT[c.type].rad+10;
  for(const s of[1,-1,2]){const a=c.ang+(s===2?Math.PI:s*1.57),x=c.x+Math.cos(a)*rr,y=c.y+Math.sin(a)*rr;
    if(!blocked(x,y,P.r)||(force&&s===2)){P.x=x;P.y=y;P.car=null;P.alt=0;c.brake=false;return;}}
  if(force){P.car=null;P.alt=0;}
}
function vehFire(c){
  if(c.cool>0)return;
  const t=c.type;
  if(t==='tank'){c.cool=1.5;const a=c.turret,mx=c.x+Math.cos(a)*52,my=c.y+Math.sin(a)*52;
    shots.push({k:'shell',x:mx,y:my,z:17,vx:Math.cos(a)*1500,vy:Math.sin(a)*1500,vz:Math.sin(.42-cam.pitch)*500,life:1.6,o:'p'});
    part(mx,my,17,0,0,0,.09,22,40,2,1.5,.6,0,0);smoke(mx,my,17,6,10);light(mx,my,20,1,.75,.4,420,.12);sfxCannon();S.shake=.35;c.v-=40;alarm();}
  else if(t==='heli'||t==='jet'){c.cool=t==='jet'?.28:.42;c.side=-(c.side||1);
    const a=c.ang,sx=-Math.sin(a)*c.side*(t==='jet'?16:8),sy=Math.cos(a)*c.side*(t==='jet'?16:8),sp=1300+Math.abs(c.v);
    let vz=c.vz*.5-(t==='heli'?clamp(c.alt*1.6,0,620):clamp(c.alt*.9,0,500))+Math.sin(.42-cam.pitch)*300;if(c.alt<12)vz=20;
    shots.push({k:'rocket',x:c.x+Math.cos(a)*30+sx,y:c.y+Math.sin(a)*30+sy,z:c.alt+7,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz,life:2.6,o:'p'});
    sfxShot(5,c.x,c.y);}
}
function updPlayer(dt){
  P.cool-=dt;P.gcool-=dt;P.punch-=dt;P.aimT-=dt;P.moving=0;
  P.hurtT-=dt;if(P.hurtT<=0&&P.hp<100)P.hp=Math.min(100,P.hp+8*dt);
  const up=keys.w||keys.arrowup,dn=keys.s||keys.arrowdown,lf=keys.a||keys.arrowleft,rt=keys.d||keys.arrowright;
  const c=P.car;
  if(c){
    const t=CT[c.type],thr=(up?1:0)-(dn?1:0),st=(rt?1:0)-(lf?1:0),lift=(keys[' ']?1:0)-(keys.shift?1:0);
    c.cool-=dt;c.brake=false;
    if(mouse.down&&c.hp>0)vehFire(c);
    if(c.type==='heli'){

/* ---------------- cars ---------------- */
function aiDrive(c,dt){
  const a=c.ai,chase=c.cop&&S.wanted>0&&P.alt<60;
  let tx=a.wx,ty=a.wy,maxV=a.phase?150:95;
  if(chase){
    maxV=a.phase?340:160;
    const d=dist(c,P);
    if(d<280&&los(c.x,c.y,P.x,P.y)){
      a.direct=true;tx=P.x;ty=P.y;maxV=320;
      if(d<105&&(!P.car||Math.abs(P.car.v)<70)){dismount(c);return;}
    }else if(a.direct)reanchor(c);
  }else if(a.direct)reanchor(c);
  const df=angDiff(Math.atan2(ty-c.y,tx-c.x),c.ang);
  c.ang+=clamp(df,-3.6*dt,3.6*dt);
  let tv=maxV*(Math.abs(df)>.6?.5:1),block=false;
  if(!a.direct){
    const cx=Math.cos(c.ang),cy=Math.sin(c.ang);
    for(const o of cars){if(o===c||o.dead||o.alt>20)continue;const dx=o.x-c.x,dy=o.y-c.y,d=Math.hypot(dx,dy);
      if(d<62+CT[o.type].rad&&(dx*cx+dy*cy)/d>.75){block=true;break;}}
    if(!block&&!P.car&&!chase){const dx=P.x-c.x,dy=P.y-c.y,d=Math.hypot(dx,dy);if(d<60&&(dx*cx+dy*cy)/d>.7)block=true;}
  }
  if(block){a.stuck+=dt;tv=a.stuck>5?70:0;if(a.stuck>7)a.stuck=0;}else a.stuck=Math.max(0,a.stuck-dt);
  c.brake=tv<c.v-20;
  c.v+=clamp(tv-c.v,-420*dt,(chase?330:200)*dt);
  if(!a.direct&&Math.hypot(a.wx-c.x,a.wy-c.y)<36){
    if(a.phase===0){a.i+=DX[a.d];a.j+=DY[a.d];a.phase=1;[a.wx,a.wy]=entryPt(a.i,a.j,a.d);}
    else{a.d=chooseDir(c);a.phase=0;[a.wx,a.wy]=exitPt(a.i,a.j,a.d);}
  }
}
function airMove(c,dt){

  if(h&&c.alt<h-4){ // flew into a wall
    if(Math.abs(c.v)>180||c.type==='jet'&&c.alt>4){c.hp=-999;explode(c);return;}
    c.v*=-.4;c.hp-=25;S.shake=.3;
  }else{c.x=nx;c.y=ny;}
  // keep aircraft near the island
  if(c.x<-7000||c.x>WW+7000||c.y<-7000||c.y>WH+7000){c.ang+=clamp(angDiff(Math.atan2(WH/2-c.y,WW/2-c.x),c.ang),-1.5*dt,1.5*dt);if(c===P.car)S.prompt='Leaving the area — turning back';}

}

        if(a===P.car||b===P.car){S.shake=.3;snd(100,.15,'square',.07,-30);const o2=a===P.car?b:a;if(o2.cop&&o2.ai)crime(.3);}}

  }

/* ---------------- peds ---------------- */
function updPeds(dt){
  for(const p of peds){
    if(p.dead){p.deadT-=dt;continue;}
    p.moving=0;
    if(p.kind==='civ'||(p.kind==='cop'&&S.wanted===0)){
      if(p.kind==='cop')p.leave-=dt;
      if(p.panic>0){
        p.panic-=dt;p.ang=Math.atan2(p.y-P.y,p.x-P.x)+Math.sin(S.t*3+p.seed)*.6;
        moveEnt(p,Math.cos(p.ang)*130*dt,Math.sin(p.ang)*130*dt,5);p.walk+=dt*17;p.moving=2;
      }else{
        const tt=tile(Math.floor((p.x+DX[p.d]*16)/T),Math.floor((p.y+DY[p.d]*16)/T));
        if(!(tt===WALK||tt===SAND||tt===PARK||tt===LOT)||Math.random()<.12*dt)p.d=Math.random()*4|0;
        else{p.x+=DX[p.d]*26*dt;p.y+=DY[p.d]*26*dt;p.moving=1;}
        p.ang+=angDiff(p.d*Math.PI/2,p.ang)*Math.min(1,dt*6);p.walk+=dt*3.6;
      }
      continue;
    }
    const d=dist(p,P),see=d<470&&P.alt<90&&los(p.x,p.y,P.x,P.y);
    if(p.kind==='gang'&&d>700)continue;
    p.ang=Math.atan2(P.y-p.y,P.x-p.x);
    const keep=(p.kind==='cop'&&S.wanted<2)?0:150;
    if(d>keep+10||!see){
      let a=p.ang;if(p.sideT>0){p.sideT-=dt;a+=p.side;}
      const sp=p.kind==='cop'?118:92;
      if(d>14){const hit=moveEnt(p,Math.cos(a)*sp*dt,Math.sin(a)*sp*dt,5);
        if(hit&&p.sideT<=0){p.sideT=.7;p.side=(Math.random()<.5?1:-1)*1.4;}
        p.walk+=dt*15;p.moving=2;}
    }
    p.cool-=dt;
    if(see&&p.cool<=0&&!S.dead&&(p.kind==='gang'||S.wanted>=2)){
      const mx=p.x+Math.cos(p.ang)*10,my=p.y+Math.sin(p.ang)*10;
      fire(mx,my,p.ang+rnd(-.12,.12),5,'e');part(mx,my,13,0,0,0,.05,5,8,2,1.6,.7,0,0);
      p.cool=rnd(.7,1.6);sfxShot(1,p.x,p.y,.6);
    }
  }
}

        if(b.life>0)for(const c of cars)if(c!==P.car&&!c.dead&&c.alt<24&&Math.hypot(c.x-b.x,c.y-b.y)<CT[c.type].rad){c.hp-=b.dmg*(c.type==='tank'?0:.6);spark(b.x,b.y,'#ffd766',2,90,10);b.life=0;if(c.cop&&c.ai)crime(.5);break;}

/* rockets, tank shells, grenades — full 3D ballistics */
function updShots(dt){

      const h=dt/N,ox=s.x,oy=s.y;

// box in a local frame: +x forward, +y up, +z right, rotated by yaw around the origin (ox,oy,oz)
function box(B,ox,oy,oz,yaw,lx,ly,lz,sx,sy,sz,r,g,b,k){

  if(k!==5){quad(B,ax,y1,az,bx,y1,bz,cx,y1,cz,dx,y1,dz,0,1,0,r,g,b,tk,0,0);if(!fac)quad(B,ax,y0,az,bx,y0,bz,cx,y0,cz,dx,y0,dz,0,-1,0,r,g,b,tk,0,0);}
  quad(B,ax,y0,az,bx,y0,bz,bx,y1,bz,ax,y1,az,s,0,-c,r,g,b,k,ux,vh);
  quad(B,bx,y0,bz,cx,y0,cz,cx,y1,cz,bx,y1,bz,c,0,s,r,g,b,k,uz,vh);
  quad(B,cx,y0,cz,dx,y0,dz,dx,y1,dz,cx,y1,cz,-s,0,c,r,g,b,k,ux,vh);

  for(const c of cars)if(c.enemy&&!c.dead){const q=proj(c.x,34,c.y);if(q){ctx.fillStyle='#ff4a5c';ctx.beginPath();ctx.moveTo(q[0],q[1]+9);ctx.lineTo(q[0]-8,q[1]-6);ctx.lineTo(q[0]+8,q[1]-6);ctx.closePath();ctx.fill();}}
  if(!S.dead&&!S.map){
    let q=null;const c=P.car;
    if(!c){const a=aimAngle();q=proj(P.x+Math.cos(a)*220,gY(P.x,P.y)+13,P.y+Math.sin(a)*220);}
    else if(c.type==='tank')q=proj(c.x+Math.cos(c.turret)*420,gY(c.x,c.y)+16+Math.sin(.42-cam.pitch)*140,c.y+Math.sin(c.turret)*420);
    else if(CT[c.type].air)q=proj(c.x+Math.cos(c.ang)*600,Math.max(4,c.alt*.45),c.y+Math.sin(c.ang)*600);
    if(q){ctx.strokeStyle=aimLock&&!c?'#ff4a5c':'rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(q[0],q[1],aimLock&&!c?9:c?11:5,0,7);ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.fillRect(q[0]-1,q[1]-1,2,2);}
  }
  drawHUD();
  if(!gl)txt('WebGL is not available in this browser.',W/2,H/2,'bold 22px '+F,'#ff4a5c','center');
  else if(!S.paused&&document.pointerLockElement!==cv)txt('Click to capture the mouse  ·  mouse = look around',W/2,H*.2,'bold 16px '+F,'rgba(255,255,255,.9)','center');
}

/* ---------------- the mission ---------------- */
function giveLoadout(){
  P.own=[1,1,P.own[2]||0,1,P.own[4]||0,1];
  P.ammo[1]=Math.max(P.ammo[1],60);P.ammo[3]=Math.max(P.ammo[3],240);P.ammo[5]=Math.max(P.ammo[5],4);
  P.gren=Math.max(P.gren,6);P.armor=100;P.hp=100;if(P.w===0)P.w=3;
}
function spawnGang(x,y,n,far){
  const m=S.mission;
  for(let k=0;k<n;k++)for(let tr=0;tr<40;tr++){
    const a=rnd(0,6.28),r=far?rnd(300,480):rnd(30,200),px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
    if(!blocked(px,py,8)){const g=mkPed('gang',px,py);m.ents.push(g);break;}
  }
}
function startMission(cp){
  S.mission={def:MISSION,idx:-1,cp:cp||0,ents:[],trucks:[],car:null,target:null,text:'',sub:'',ring:0};
  banner(cp>9?'Sky High':cp>4?'Heavy Metal':MISSION.name,'Mission '+(cp>9?3:cp>4?2:1)+' of 3','#22e6ff');snd(440,.3,'triangle',.07,440);
  if(cp>0)restartCP();else nextStep();
}
function cleanEnts(){
  const m=S.mission;
  for(const e of m.ents)if(!e.dead)e.gone=true;
  peds=peds.filter(p=>!p.gone);m.ents=[];
  for(const t of m.trucks)t.gone=true;
  cars=cars.filter(c=>!c.gone);m.trucks=[];
  if(m.car&&m.car!==P.car){m.car.mission=false;}
}
function restartCP(){
  const m=S.mission,s=m.def.steps[m.cp];
  cleanEnts();
  if(P.car)P.car=null;
  P.x=s.cp[0]*T;P.y=s.cp[1]*T;P.alt=0;P.hp=100;cam.x=P.x;cam.y=P.y;cam.alt=0;
  if(m.cp>=3)giveLoadout();
  ensureBase();for(const k in S.base){const c=S.base[k],b=BASE[k];if(c!==P.car&&(c.alt>1||dist(c,{x:b[0]*T,y:b[1]*T})>60)){c.x=b[0]*T;c.y=b[1]*T;c.ang=b[2];c.alt=0;c.v=0;c.vz=0;c.hp=CT[k].hp;c.burn=0;c.pitch=c.roll=0;}}
  m.idx=m.cp-1;note('Checkpoint.');nextStep();
}
function nextStep(){
  const m=S.mission;m.idx++;m.target=null;m.sub='';
  if(m.idx>=m.def.steps.length)return passMission();
  const s=m.def.steps[m.idx];if(s.text)m.text=s.text;
  if(s.cp&&m.idx>m.cp){m.cp=m.idx;save();}
  if(s.t==='give'){giveLoadout();note('Loadout: assault rifle, pistol, RPG, 6 grenades, body armor.');return nextStep();}
  if(s.t==='wanted'){setWanted(s.lv);return nextStep();}
  if(s.t==='pass'){S.money+=s.reward;clearWanted();banner('MISSION PASSED','+$'+s.reward.toLocaleString());sfxWin();m.wait=5.5;m.text='';save();return;}
  if(s.t==='car'){const c=mkCar(s.type,s.at[0]*T,s.at[1]*T,0);c.mission=true;c.col='#b3262b';m.car=c;m.target={x:c.x,y:c.y};return;}
  if(s.t==='goto'){m.target={x:s.at[0]*T,y:s.at[1]*T};return;}
  if(s.t==='kill'){spawnGang(s.at[0]*T,s.at[1]*T,s.n);m.target={x:s.at[0]*T,y:s.at[1]*T};return;}
  if(s.t==='veh'){ensureBase();const c=S.base[s.v];m.target={x:c.x,y:c.y};return;}
  if(s.t==='destroy'){for(const a of s.at){const c=mkCar('truck',a[0]*T,a[1]*T,rnd(0,6.28));c.enemy=true;m.trucks.push(c);spawnGang(c.x,c.y,2);}return;}
  if(s.t==='rings'){m.ring=0;}
}
function passMission(){
  const r=MISSION.reward;
  S.money+=r;S.done=1;cleanEnts();S.mission=null;
  banner('MISSION PASSED','+$'+r.toLocaleString());sfxWin();
  S.endT=4;save();
}
function updMission(dt){
  const m=S.mission;if(!m)return;
  const s=m.def.steps[m.idx];
  if(s.t==='pass'){m.wait-=dt;if(m.wait<=0){banner(s.next,'Mission '+(s.n+1)+' of 3','#22e6ff');snd(440,.3,'triangle',.07,440);nextStep();}return;}
  if(s.t==='car'){
    if(m.car.dead){m.idx--;return nextStep();}
    m.target.x=m.car.x;m.target.y=m.car.y;if(P.car===m.car)nextStep();}
  else if(s.t==='goto'){
    if(s.car&&!P.car)m.sub='you need a vehicle';else m.sub='';
    if(dist(P,m.target)<60&&(!s.car||P.car)&&(!s.stop||!P.car||Math.abs(P.car.v)<160)){snd(880,.12,'square',.05);nextStep();}}
  else if(s.t==='kill'){
    let n=0,best=null,bd=1e9;for(const e of m.ents)if(!e.dead){n++;const d=dist(e,P);if(d<bd){bd=d;best=e;}}
    if(!n)nextStep();else{m.sub=n+' left';m.target={x:best.x,y:best.y};}}
  else if(s.t==='veh'){
    let c=S.base[s.v];if(c.dead){ensureBase();c=S.base[s.v];}
    m.target={x:c.x,y:c.y};if(P.car===c){snd(880,.12,'square',.05);nextStep();}}
  else if(s.t==='destroy'){
    let n=0,best=null,bd=1e9;for(const c of m.trucks)if(!c.dead){n++;const d=dist(c,P);if(d<bd){bd=d;best=c;}}
    if(!n)nextStep();else{m.sub=n+' left';m.target={x:best.x,y:best.y};}}
  else if(s.t==='rings'){
    let c=S.base[s.v];if(c.dead){ensureBase();c=S.base[s.v];}
    if(P.car!==c){m.sub='get back in the '+(s.v==='heli'?'helicopter':'jet');m.target={x:c.x,y:c.y};return;}
    const p=s.pts[m.ring],rx=p[0]*T,ry=p[1]*T;
    m.sub='ring '+(m.ring+1)+' of '+s.pts.length;m.target={x:rx,y:ry,alt:p[2],r:s.r||130};
    if(Math.hypot(P.x-rx,P.y-ry,P.alt-p[2])<(s.r||130)){snd(880,.15,'square',.06);setTimeout(()=>snd(1320,.2,'square',.06),90);m.ring++;if(m.ring>=s.pts.length)nextStep();}
  }
}

/* ---------------- world ---------------- */
function nearPlace(){if(P.alt>20)return null;for(const p of PLACES)if(Math.hypot(P.x-p.x*T,P.y-p.y*T)<50)return p;return null;}
function interact(){
  const p=nearPlace();if(!p)return;
  if(p.k==='gun'&&!P.car)shopMenu();
  else if(p.k==='food'){if(P.hp>=100)note('You are not hungry.');else if(S.money<25)note('Not enough cash.');else{S.money-=25;P.hp=100;note('Tacos devoured. Health restored.');snd(600,.15,'triangle',.06,300);}}
  else if(p.k==='safe'){if(S.wanted>0){note('Too hot — lose the cops first.');return;}P.hp=100;S.tod=(S.tod+8)%24;save();note('Game saved. You feel rested.');snd(520,.25,'triangle',.06,260);}
}
function updWorld(dt){
  S.prompt='';
  const pl=nearPlace();
  if(pl){
    if(pl.k==='spray'){
      S.prompt=pl.n;S.sprayT-=dt;
      const c=P.car;
      if(c&&Math.abs(c.v)<40&&S.sprayT<=0&&(S.wanted>0||c.hp<CT[c.type].hp)){
        if(S.money<250){note('Respray costs $250.');S.sprayT=4;}
        else{S.money-=250;c.hp=CT[c.type].hp;c.burn=0;if(!c.keep)c.col=pick(CARCOL);clearWanted();
          peds=peds.filter(p=>p.kind!=='cop');for(const k of cars)if(k.cop&&k.ai)reanchor(k);
          note('Fresh paint, clean record.');snd(300,.4,'triangle',.06,500);S.sprayT=3;}
      }
    }else if(pl.k==='gun'||pl.k==='food'||pl.k==='safe')S.prompt='[E]  '+pl.n;
    else S.prompt=pl.n;
  }
  if(!P.car&&!S.prompt){const c=nearCar();if(c)S.prompt='[F]  Enter '+VNAME[c.type].toLowerCase();}
  for(const k of picks){k.life-=dt;if(!P.alt&&dist(k,P)<20){S.money+=k.amt;k.life=0;snd(900,.08,'square',.04,300);}}
  picks=picks.filter(k=>k.life>0);
}
function spawner(dt){
  S.spT-=dt;if(S.spT>0)return;S.spT=.25;
  cars=cars.filter(c=>c===P.car||c.mission||c.keep||c.enemy||dist(c,P)<(c.dead?1500:2300));
  peds=peds.filter(p=>{
    if(p.kind==='gang'&&!p.dead)return true;
    const d=dist(p,P);
    if(p.dead)return p.deadT>0&&d<1700;
    if(p.kind==='cop'&&S.wanted===0&&p.leave<=0&&d>500)return false;
    return d<1700;
  });
  let tr=0,civ=0,foot=0,cc=0;
  for(const c of cars){if(c.ai&&!c.cop)tr++;if(c.cop&&c.ai)cc++;}
  for(const p of peds){if(p.dead)continue;if(p.kind==='civ')civ++;else if(p.kind==='cop')foot++;}
  if(tr<24)trySpawnTraffic(false);
  if(civ<44)trySpawnPed(false);
  if(S.wanted>0&&running&&P.alt<120){S.copT-=.25;if(S.copT<=0){S.copT=3;if(cc+Math.ceil(foot/2)<Math.min(S.wanted+1,5))spawnCopCar();}}
}

/* ---------------- main update ---------------- */
function update(dt){
  S.t+=dt;S.tod=(S.tod+dt*24/900)%24;
  if(!running){spawner(dt);updCars(dt);updPeds(dt);updParts(dt);return;}
  S.stats.time+=dt;S.hit-=dt;S.shake-=dt*1.6;
  for(const n of S.notes)n.life-=dt;S.notes=S.notes.filter(n=>n.life>0);
  if(S.banner){S.banner.life-=dt;if(S.banner.life<=0)S.banner=null;}
  if(S.intro){S.intro.t+=dt;spawner(dt);updCars(dt);updPeds(dt);updParts(dt);if(S.intro.t>12){S.intro=null;startMission(0);}return;}
  if(S.dead){S.dead.t-=dt;updCars(dt);updPeds(dt);updShots(dt);updParts(dt);if(S.dead.t<=0)respawn();return;}
  if(S.ending){
    S.ending.t+=dt;const c=P.car;
    if(c&&CT[c.type].air){c.vz+=clamp((c.alt<500?140:0)-c.vz,-300*dt,300*dt);c.v+=clamp(620-c.v,-200*dt,200*dt);c.roll+=(.25-c.roll)*dt;c.ang+=.12*dt;c.pitch*=.97;c.brake=true;c.rotor+=dt*30;}
    updCars(dt);updPeds(dt);updParts(dt);spawner(dt);
    if(S.ending.t>19&&!S.ending.done){S.ending.done=true;endMenu();}
    return;
  }
  updPlayer(dt);updCars(dt);updPeds(dt);updBullets(dt);updShots(dt);updParts(dt);updWanted(dt);updWorld(dt);updMission(dt);spawner(dt);
  S.saveT-=dt;if(S.saveT<=0){S.saveT=20;if(!S.mission)save();}
  if(S.endT>0){S.endT-=dt;if(S.endT<=0){S.ending={t:0};clearWanted();}}
  // camera
  const c=P.car,k=Math.min(1,dt*3);
  let td=62,tp=null;
  if(c){
    if(c.type!=='tank')cam.yaw+=angDiff(c.ang,cam.yaw)*Math.min(1,dt*3.4);
    td=c.type==='tank'?165:c.type==='heli'?200:c.type==='jet'?215+c.v*.05:112+Math.abs(c.v)*.09;
    tp=c.type==='jet'?.2:c.type==='heli'?.3:c.type==='tank'?null:.3;
  }
  cam.dist+=(td-cam.dist)*k;if(tp!=null)cam.pitch+=(tp-cam.pitch)*Math.min(1,dt*1.5);
  cam.x+=(P.x-cam.x)*Math.min(1,dt*12);cam.y+=(P.y-cam.y)*Math.min(1,dt*12);cam.alt+=(P.alt-cam.alt)*Math.min(1,dt*10);
}

    txt(b.a,W/2,H*.3,'italic '+(66*u)+'px '+I,b.col,'center');txt(b.b,W/2,H*.3+54*u,'bold '+(21*u)+'px '+F,'#fff','center');ctx.globalAlpha=1;}
  if(S.map){ctx.fillStyle='rgba(6,4,18,.86)';ctx.fillRect(0,0,W,H);
    const s=Math.min((W-80)/mm.width,(H-120)/mm.height),ox=(W-mm.width*s)/2,oy=(H-mm.height*s)/2+14,g=s/16;
    ctx.drawImage(mm,ox,oy,mm.width*s,mm.height*s);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(ox,oy,mm.width*s,mm.height*s);
    blips((wx,wy,col,l,r)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(ox+wx*g,oy+wy*g,(l?r+5:r+1),0,7);ctx.fill();
      if(l){ctx.fillStyle='#0a0814';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l,ox+wx*g,oy+wy*g+.5);}});
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ox+clamp(P.x,0,WW)*g,oy+clamp(P.y,0,WH)*g,6,0,7);ctx.fill();ctx.strokeStyle='#000';ctx.stroke();
    txt('NEON TIDE — CITY MAP',W/2,oy-24,'italic 30px '+I,'#ffe36b','center');
    txt('H safehouse  ·  G guns  ·  T tacos  ·  S respray  ·  + hospital  ·  P police  ·  A airfield     [M] close',W/2,oy+mm.height*s+22,'14px '+F,'#d6cfe8','center');}
}
function cine(){ // letterbox + titles for intro / ending
  const u=Math.min(W/1280,H/720),bh2=H*.12;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,bh2);ctx.fillRect(0,H-bh2,W,bh2);
  const fade=(t,a,b)=>clamp(Math.min(t-a,b-t)*1.4,0,1);
  if(S.intro){const t=S.intro.t;
    ctx.globalAlpha=clamp(1.2-t*.8,0,1);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=fade(t,.5,3.4);txt(SITE,W/2,H*.47,'bold '+(40*u)+'px '+F,'#fff','center');txt('P R E S E N T S',W/2,H*.47+44*u,(16*u)+'px '+F,'#ffb86b','center');
    ctx.globalAlpha=fade(t,3.8,7);if(PORT.complete&&PORT.naturalWidth){const pr=74*u,px=W/2,py=H*.4;ctx.save();ctx.beginPath();ctx.arc(px,py,pr,0,7);ctx.clip();ctx.drawImage(PORT,px-pr,py-pr,pr*2,pr*2);ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=3*u;ctx.beginPath();ctx.arc(px,py,pr,0,7);ctx.stroke();}txt('S T A R R I N G',W/2,H*.4+104*u,(15*u)+'px '+F,'#ffb86b','center');txt('HASEEB',W/2,H*.4+146*u,'italic '+(56*u)+'px '+I,'#fff','center');
    ctx.globalAlpha=fade(t,7.4,11.6);txt('NEON TIDE',W/2,H*.45,'italic '+(130*u)+'px '+I,'#ffe36b','center');txt('W E L C O M E   T O   T H E   C O A S T',W/2,H*.45+84*u,(18*u)+'px '+F,'#fff','center');
    ctx.globalAlpha=.7;txt('click or press Enter to skip',W/2,H-bh2/2,(13*u)+'px '+F,'#aaa','center');ctx.globalAlpha=1;}
  else{const t=S.ending.t;
    ctx.globalAlpha=fade(t,1,6);txt('NEON TIDE',W/2,H*.27,'italic '+(120*u)+'px '+I,'#ffe36b','center');txt('T H E   C O A S T   I S   Y O U R S',W/2,H*.27+80*u,(18*u)+'px '+F,'#fff','center');
    ctx.globalAlpha=fade(t,7,12.5);txt('Designed, written and built by',W/2,H*.27,(22*u)+'px '+F,'#ffb86b','center');txt(SITE,W/2,H*.27+56*u,'bold '+(64*u)+'px '+F,'#fff','center');
    ctx.globalAlpha=fade(t,13.5,19.5);txt('THANK YOU',W/2,H*.27,'italic '+(120*u)+'px '+I,'#fff','center');txt('for playing   ·   '+SITE,W/2,H*.27+84*u,'bold '+(26*u)+'px '+F,'#ffe36b','center');
    ctx.globalAlpha=1;}
}

/* ---------------- menus ---------------- */
const CREDIT='<div class="credit">Game design &amp; development by <a href="https://'+SITE+'" target="_blank" rel="noopener">'+SITE+'</a></div>';
function panel(html){$('panel').innerHTML=html;$('ov').classList.remove('hide');S.paused=true;mouse.down=false;if(document.pointerLockElement&&document.exitPointerLock)document.exitPointerLock();}
function closePanel(){$('ov').classList.add('hide');S.paused=false;if(running)lockMouse();}
function lockMouse(){if(cv.requestPointerLock){try{const q=cv.requestPointerLock();if(q&&q.catch)q.catch(()=>{});}catch(e){}}}
function menuMain(){
  running=false;const sv=loadSave();
  panel('<h1>NEON<br>TIDE</h1><div class="tag">Open-world action · HD edition</div>'+
    '<div class="hero"><img src="'+IMG_PORT+'" alt="Haseeb"><div><small>STARRING</small><b>HASEEB</b></div></div>'+
    '<button onclick="startGame(true)" '+(sv?'':'disabled')+'>Continue'+(sv?'<small>'+(sv.done?'Story complete · free roam':'Mission in progress')+'</small>':'')+'</button>'+
    '<button onclick="startGame(false)">New Game</button><button onclick="menuControls(0)">Controls</button><button onclick="menuCredits(0)">Credits</button>'+CREDIT);
}
function menuControls(inGame){
  panel('<h2>Controls</h2><ul>'+
    '<li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move / drive &nbsp; <kbd>Shift</kbd> sprint &nbsp; <kbd>Mouse</kbd> look (click the game first)</li>'+
    '<li><kbd>Click</kbd> shoot — aim snaps to targets &nbsp; <kbd>G</kbd> throw grenade &nbsp; <kbd>1</kbd>–<kbd>6</kbd> / <kbd>Q</kbd> weapons</li>'+
    '<li><kbd>F</kbd> enter / exit any vehicle &nbsp; <kbd>Space</kbd> handbrake &nbsp; <kbd>E</kbd> shops</li>'+
    '<li><b>Tank:</b> mouse aims the turret, click fires the cannon</li>'+
    '<li><b>Helicopter:</b> <kbd>Space</kbd> up, <kbd>Shift</kbd> down, <kbd>W</kbd><kbd>S</kbd> fly, <kbd>A</kbd><kbd>D</kbd> turn, click = rockets</li>'+
    '<li><b>Jet:</b> hold <kbd>W</kbd> for thrust, <kbd>Space</kbd> pulls up once fast, <kbd>Shift</kbd> nose down, click = missiles</li>'+
    '<li><kbd>H</kbd> horn &nbsp; <kbd>R</kbd> radio on/off &nbsp; <kbd>M</kbd> map &nbsp; <kbd>N</kbd> mute &nbsp; <kbd>Esc</kbd> pause</li></ul>'+
    '<p>Health comes back on its own after a few seconds out of trouble, and aircraft pull up by themselves near buildings — hold <kbd>Shift</kbd> when you really want to descend.</p>'+
    '<button onclick="'+(inGame?'pauseMenu()':'menuMain()')+'">Back</button>'+CREDIT);
}
function menuCredits(inGame){
  panel('<h2>Credits</h2><p class="big">NEON TIDE</p><p>Game design, code &amp; art direction</p>'+
    '<p class="big"><a href="https://'+SITE+'" target="_blank" rel="noopener">'+SITE+'</a></p>'+
    '<p>Built with plain HTML, CSS and hand-written WebGL: real-time shadows, procedural materials, bloom and a full day/night cycle. No engines, no external assets — one file, saved with localStorage.</p>'+
    '<p style="margin-top:10px;font-size:13px;color:#8d85a8">An original game. All names, places and characters are fictional.</p>'+
    '<button onclick="'+(inGame?'pauseMenu()':'menuMain()')+'">Back</button>');
}
function pauseMenu(){
  const s=S.stats;
  panel('<h2>Paused</h2><p>Takedowns '+s.kills+' · Vehicles taken '+s.stolen+' · Explosions '+s.booms+' · '+(s.dist/10/1000).toFixed(1)+' km travelled · '+Math.floor(s.time/60)+' min played</p>'+
    '<button onclick="closePanel()">Resume</button><button onclick="menuControls(1)">Controls</button><button onclick="menuCredits(1)">Credits</button>'+
    '<button onclick="toggleMute();pauseMenu()">Sound: '+(mute?'Off':'On')+'</button>'+
    '<button onclick="setQ();pauseMenu()">Graphics: '+['Low','Medium','High'][QUAL]+'</button>'+
    '<button onclick="quitToMenu()">Save &amp; quit to menu</button>'+CREDIT);
}
function shopMenu(){
  const it=(label,cost,fn,dis)=>'<button onclick="'+fn+'" '+(dis||S.money<cost?'disabled':'')+'>'+label+'<small>$'+cost+'</small></button>';
  const PR=[0,400,1500,2800,1200,6000],AM=[0,60,150,180,24,4];
  let h='<h2>Ammo Depot</h2><p>Cash: <b style="color:#7dffae">$'+Math.floor(S.money).toLocaleString()+'</b></p>';
  for(let i=1;i<6;i++)h+=it(WP[i].n+(P.own[i]?' ammo':'')+' ×'+AM[i],P.own[i]?Math.round(PR[i]*.3):PR[i],'buy('+i+')');
  panel(h+it('Grenades ×5',600,'buy(8)')+it('Body armor',500,'buy(9)',P.armor>=100)+'<button onclick="closePanel()">Leave</button>');
}
function buy(i){
  const PR=[0,400,1500,2800,1200,6000],AM=[0,60,150,180,24,4];
  if(i===9){if(S.money<500)return;S.money-=500;P.armor=100;}
  else if(i===8){if(S.money<600)return;S.money-=600;P.gren+=5;}
  else{const cost=P.own[i]?Math.round(PR[i]*.3):PR[i];if(S.money<cost)return;S.money-=cost;P.own[i]=1;P.ammo[i]+=AM[i];P.w=i;}
  snd(700,.1,'square',.05,300);save();shopMenu();
}
function endMenu(){
  const s=S.stats;
  panel('<h1 style="font-size:64px">THANK<br>YOU</h1><div class="tag">for playing Neon Tide</div>'+
    '<p>'+Math.floor(s.time/60)+' minutes · '+s.booms+' explosions · '+s.stolen+' vehicles taken.</p>'+
    '<div class="hero"><img src="'+IMG_PORT+'" alt="Haseeb"><div><small>STARRING &amp; CREATED BY</small><b>HASEEB</b></div></div>'+
    '<p class="big" style="margin-top:14px">Created by <a href="https://'+SITE+'" target="_blank" rel="noopener">'+SITE+'</a></p>'+
    '<button onclick="S.ending=null;closePanel()">Keep roaming</button>');
}
function toggleMute(){mute=!mute;}
function quitToMenu(){save();newState(loadSave());menuMain();}
function startGame(cont){
  if(!cont&&loadSave()&&!confirm('Start a new game? Your saved progress will be overwritten.'))return;
  const sv=cont?loadSave():null;
  auInit();newState(sv);running=true;closePanel();
  if(!cont){save();S.intro={t:0};}
  else if(!S.done)startMission(S.cpSaved);
  else note('Welcome back. The whole city is yours.');
}

/* ---------------- input ---------------- */
let lockT=-1e9;
function onKey(k){
  if(!running)return;
  if(S.intro){if(k==='enter'||k===' '||k==='escape')S.intro.t=Math.max(S.intro.t,11.6);return;}
  if(k==='escape'||k==='p'){if(performance.now()-lockT<400)return;if(S.map){S.map=false;return;}if(S.paused)closePanel();else pauseMenu();return;}
  if(S.paused||S.dead||S.ending)return;
  if(k==='f'||k==='enter'){if(P.car)exitCar(false);else enterCar();}
  else if(k==='e')interact();
  else if(k==='g')throwGrenade();
  else if(k==='h'&&P.car&&!CT[P.car.type].air){sfxHorn();for(const p of peds)if(p.kind==='civ'&&!p.dead&&dist(p,P)<160)p.panic=2;}
  else if(k==='r'){MUS.on=!MUS.on;note('Radio '+(MUS.on?'on':'off'));}
  else if(k==='m')S.map=!S.map;
  else if(k==='n'){mute=!mute;note('Sound '+(mute?'off':'on'));}
  else if(k==='q'){for(let i=1;i<=6;i++){const w=(P.w+i)%6;if(P.own[w]&&(w===0||P.ammo[w]>0)){P.w=w;break;}}}
  else if(k>='1'&&k<='6'){const w=+k-1;if(P.own[w])P.w=w;}
}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(running&&['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k))e.preventDefault();
  if(!keys[k]&&!e.repeat)onKey(k);keys[k]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;});
cv.addEventListener('mousedown',e=>{if(e.button!==0)return;
  if(S.intro){S.intro.t=Math.max(S.intro.t,11.6);return;}
  if(running&&!S.paused&&document.pointerLockElement!==cv)lockMouse();
  mouse.down=true;});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===cv&&running&&!S.paused){cam.yaw+=(e.movementX||0)*.0026;cam.pitch=clamp(cam.pitch+(e.movementY||0)*.0018,.06,1.0);}});
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==cv&&running&&!S.paused&&!S.dead&&!S.intro&&!S.ending){lockT=performance.now();pauseMenu();}});
addEventListener('mouseup',()=>{mouse.down=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------------- loop ---------------- */
let last=0;
function frame(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(!S.paused||!running)update(dt);
  auUpdate(dt);
  draw();
  requestAnimationFrame(frame);
}
addEventListener('pointerdown',auInit);addEventListener('keydown',auInit);
resize();newState(loadSave());menuMain();requestAnimationFrame(frame);

</script>
</body>
</html>
