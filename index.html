const SITE='developerhaseeb.com', SAVE_KEY='neontide_save_v1';
const T=64,MW=84,MH=72,CITY=74;
const ROAD=1,WALK=2,BLD=3,WATER=4,SAND=5,PARK=6,LOT=7;
const DX=[1,0,-1,0],DY=[0,1,0,-1];
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=1280,H=720;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}

/* ---------------- sound (tiny synth) ---------------- */
let AC=null,mute=false;
function snd(f,d,type,v,slide){
  if(mute)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ---------------- world generation ---------------- */
const map=new Uint8Array(MW*MH),buildings=[],trees=[];
const PASTEL=['#e8a0b4','#f2c38a','#8fd3d1','#c9a7e8','#f5e3a1','#9db7e8','#e88f7a','#b8e0a8','#f0f0f0'];
const NEON=['#ff2bd6','#22e6ff','#ffe14a','#7dff6a','#ff7a3d'];
function tile(tx,ty){return tx<0||ty<0||tx>=MW||ty>=MH?BLD:map[ty*MW+tx];}
function sol(px,py){const t=tile(Math.floor(px/T),Math.floor(py/T));return t===BLD||t===WATER;}
function blocked(x,y,r){return sol(x-r,y-r)||sol(x+r,y-r)||sol(x-r,y+r)||sol(x+r,y+r);}
function moveEnt(e,dx,dy,r){let hit=false;
  if(!blocked(e.x+dx,e.y,r))e.x+=dx;else hit=true;
  if(!blocked(e.x,e.y+dy,r))e.y+=dy;else hit=true;
  return hit;}
function los(x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/24);
  for(let i=1;i<n;i++){const k=i/n;if(tile(Math.floor((x1+(x2-x1)*k)/T),Math.floor((y1+(y2-y1)*k)/T))===BLD)return false;}
  return true;}
function addB(tx,ty,w,h,seed){
  for(let y=ty;y<ty+h;y++)for(let x=tx;x<tx+w;x++)map[y*MW+x]=BLD;
  buildings.push({x:tx*T,y:ty*T,w:w*T,h:h*T,c:PASTEL[hash(seed,tx*7+ty)*PASTEL.length|0],n:NEON[hash(tx,seed+ty)*NEON.length|0],s:hash(tx+3,ty+seed)});
}
function genMap(){
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    let t;
    if(x>=MW-6)t=WATER;else if(x>=CITY)t=SAND;
    else t=(x%10<2||y%10<2)?ROAD:WALK;
    map[y*MW+x]=t;
  }
  for(let by=0;by<7;by++)for(let bx=0;bx<7;bx++){
    const ix=bx*10+3,iy=by*10+3,v=hash(bx+11,by+5)*5|0,sd=bx*13+by*29;
    for(let y=iy;y<iy+6;y++)for(let x=ix;x<ix+6;x++)map[y*MW+x]=v===3?PARK:LOT;
    if(v===0)addB(ix,iy,6,6,sd);
    else if(v===1){addB(ix,iy,6,2,sd);addB(ix,iy+4,6,2,sd+1);}
    else if(v===2){addB(ix,iy,2,2,sd);addB(ix+4,iy,2,2,sd+1);addB(ix,iy+4,2,2,sd+2);addB(ix+4,iy+4,2,2,sd+3);}
    else if(v===3){for(let k=0;k<7;k++)trees.push({x:(ix+.5+hash(sd,k)*5)*T,y:(iy+.5+hash(k,sd)*5)*T,p:0,s:hash(k,k+sd)});}
    else{addB(ix,iy,6,3,sd);addB(ix,iy+3,3,3,sd+1);}
  }
  for(let y=1;y<MH;y+=3)trees.push({x:(CITY+.6+hash(y,3)*1.2)*T,y:(y+hash(3,y))*T,p:1,s:hash(y,y)});
}
genMap();
// minimap
const mm=document.createElement('canvas');mm.width=MW*4;mm.height=MH*4;
(function(){const m=mm.getContext('2d');const col={[ROAD]:'#6a7088',[WALK]:'#2a2e3c',[LOT]:'#2a2e3c',[BLD]:'#171923',[WATER]:'#1c6a94',[SAND]:'#9a8f62',[PARK]:'#22643b'};
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){m.fillStyle=col[map[y*MW+x]];m.fillRect(x*4,y*4,4,4);}})();

/* ---------------- road graph helpers ---------------- */
function exitPt(i,j,d){const X=i*10*T,Y=j*10*T;return d===0?[X+2*T,Y+1.5*T]:d===1?[X+.5*T,Y+2*T]:d===2?[X,Y+.5*T]:[X+1.5*T,Y];}
function entryPt(i,j,d){const X=i*10*T,Y=j*10*T;return d===0?[X,Y+1.5*T]:d===1?[X+.5*T,Y]:d===2?[X+2*T,Y+.5*T]:[X+1.5*T,Y+2*T];}
function validDir(i,j,d){const a=i+DX[d],b=j+DY[d];return a>=0&&a<8&&b>=0&&b<8;}

/* ---------------- definitions ---------------- */
const CT={
  sedan:{l:46,w:22,max:330,acc:250,hp:100},
  sports:{l:46,w:21,max:480,acc:410,hp:90},
  van:{l:54,w:25,max:270,acc:190,hp:160},
  taxi:{l:46,w:22,max:340,acc:260,hp:110},
  police:{l:48,w:22,max:430,acc:370,hp:150}
};
const CARCOL=['#d83a3a','#3a78d8','#e8e8ee','#23252d','#3fb56b','#e08a2c','#8a4fd8','#19b5b0','#c9c04a'];
const SHIRT=['#e45','#4ae','#fc5','#7d6','#c7f','#f93','#eee','#59c','#d69'];
const SKIN=['#f1c7a1','#d9a273','#a8703f','#7a4a2a','#f5d7ba'];
const WP=[
  {n:'Fists',rate:.38},
  {n:'Pistol',rate:.27,dmg:27,spread:.03,pel:1},
  {n:'SMG',rate:.085,dmg:15,spread:.09,pel:1},
  {n:'Shotgun',rate:.85,dmg:14,spread:.22,pel:7}
];
const PLACES=[
  {k:'safe',n:'Safehouse — save & rest',x:12.5,y:22.5,c:'#5dff9b',l:'H'},
  {k:'gun',n:'Ammo Depot',x:22.5,y:12.5,c:'#ff8a3d',l:'G'},
  {k:'gun',n:'Ammo Depot',x:59.5,y:52.5,c:'#ff8a3d',l:'G'},
  {k:'food',n:'Taco Stand — heal for $25',x:32.5,y:22.5,c:'#ffe14a',l:'T'},
  {k:'food',n:'Taco Stand — heal for $25',x:49.5,y:62.5,c:'#ffe14a',l:'T'},
  {k:'spray',n:'Respray — drive in, $250',x:42.5,y:32.5,c:'#22e6ff',l:'S'},
  {k:'spray',n:'Respray — drive in, $250',x:19.5,y:49.5,c:'#22e6ff',l:'S'},
  {k:'hosp',n:'Hospital',x:52.5,y:12.5,c:'#ff5a7a',l:'+'},
  {k:'cop',n:'Police Station',x:32.5,y:42.5,c:'#6aa0ff',l:'P'}
];
const TOKENS=[[9,5],[29,16],[49,27],[69,38],[2,44],[22,55],[42,66],[62,7],[19,33],[39,48],[59,58],[75,20],[76,50],[12,64]];
const MISSIONS=[
 {name:'First Wheels',giver:'Rico',start:[12.5,19.5],reward:500,
  intro:'Rico: "New in town? Prove you can drive. Grab that sedan and bring it to my garage."',
  steps:[{t:'car',type:'sedan',at:[16,22.5],text:'Get in the parked sedan  [F]'},
         {t:'goto',at:[32.5,32.5],mcar:1,stop:1,text:"Drive the sedan to Rico's garage"}]},
 {name:'Hot Lunch',giver:'Mama Lu',start:[39.5,22.5],reward:900,
  intro:'Mama Lu: "Three orders, all going cold. Get a ride and move!"',
  steps:[{t:'goto',at:[59.5,12.5],car:1,stop:1,time:40,text:'Deliver order 1 of 3 (vehicle needed)'},
         {t:'goto',at:[62.5,42.5],car:1,stop:1,time:40,text:'Deliver order 2 of 3'},
         {t:'goto',at:[22.5,52.5],car:1,stop:1,time:50,text:'Deliver order 3 of 3'}]},
 {name:'Borrowed Lightning',giver:'Rico',start:[49.5,29.5],reward:1600,
  intro:'Rico: "A collector left his sports car uptown. The alarm is loud, the buyer is at the docks."',
  steps:[{t:'car',type:'sports',at:[59.5,19.5],text:'Steal the sports car uptown'},
         {t:'wanted',lv:2},
         {t:'lose',text:'The alarm tripped! Lose the cops'},
         {t:'goto',at:[72.5,62.5],mcar:1,stop:1,text:'Deliver the car to the docks in one piece'}]},
 {name:'Turf Trouble',giver:'Dee',start:[29.5,39.5],reward:2200,
  intro:'Dee: "The Viper crew is squatting on our corner. Take this piece and clear them out."',
  steps:[{t:'give',w:1,ammo:60},
         {t:'kill',at:[12.5,49.5],n:6,text:'Take out the Viper crew'}]},
 {name:'Midnight Run',giver:'Jet',start:[12.5,9.5],reward:2600,
  intro:'Jet: "Five checkpoints, no brakes. Beat the clock and the pot is yours."',
  steps:[{t:'goto',at:[39.5,9.5],car:1,time:24,text:'Checkpoint 1 of 5 (vehicle needed)'},
         {t:'goto',at:[69.5,9.5],car:1,time:20,text:'Checkpoint 2 of 5'},
         {t:'goto',at:[69.5,39.5],car:1,time:20,text:'Checkpoint 3 of 5'},
         {t:'goto',at:[39.5,39.5],car:1,time:20,text:'Checkpoint 4 of 5'},
         {t:'goto',at:[39.5,69.5],car:1,time:20,text:'Final checkpoint'}]},
 {name:'The Getaway',giver:'Dee',start:[52.5,39.5],reward:4200,
  intro:'Dee: "My crew is walking out of the bank right now. Be the wheels."',
  steps:[{t:'goto',at:[62.5,22.5],car:1,stop:1,time:45,text:'Pick up the crew at the bank (vehicle needed)'},
         {t:'wanted',lv:3},
         {t:'lose',text:'Lose the cops'},
         {t:'goto',at:[12.5,22.5],car:1,stop:1,text:'Drive the crew to the safehouse'}]},
 {name:'The Big Score',giver:'Rico',start:[22.5,29.5],reward:15000,
  intro:'Rico: "The Viper vault. Everything they own. Go in loud, hold the door, then run for the boat."',
  steps:[{t:'give',w:2,ammo:200,armor:1},
         {t:'kill',at:[49.5,49.5],n:8,text:'Clear the vault guards'},
         {t:'survive',time:45,text:'Hold out while the crew empties the vault'},
         {t:'wanted',lv:4},
         {t:'goto',at:[72.5,65.5],text:'Reach the speedboat at the docks'}]}
];

/* ---------------- state ---------------- */
let S,P,cars=[],peds=[],bullets=[],parts=[],picks=[],running=false;
const cam={x:0,y:0,z:1};
const keys={},mouse={x:0,y:0,down:false};

function loadSave(){try{return JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return null;}}
function save(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({money:S.money,done:S.done,own:P.own,ammo:P.ammo,armor:P.armor,w:P.w,tokens:S.tokens,stats:S.stats,tod:S.tod}));}catch(e){}
}
function newState(sv){
  sv=sv||{};
  S={t:0,tod:sv.tod||9,money:sv.money==null?200:sv.money,done:sv.done||0,tokens:sv.tokens||[],
     stats:Object.assign({kills:0,stolen:0,dist:0,time:0,busted:0,ko:0},sv.stats||{}),
     wanted:0,heat:0,unseen:0,arrestT:0,notes:[],banner:null,mission:null,dead:null,paused:false,
     spT:0,copT:0,saveT:20,hit:0,shake:0,sprayT:0,endT:0,map:false};
  P={x:12.5*T,y:23.5*T,ang:0,r:11,hp:100,armor:sv.armor||0,car:null,w:sv.w||0,own:sv.own||[1,0,0,0],ammo:sv.ammo||[0,0,0,0],
     cool:0,walk:0,punch:0,col:'#ff3fa4',skin:'#d9a273',kind:'player'};
  cars=[];peds=[];bullets=[];parts=[];picks=[];
  cam.x=P.x;cam.y=P.y;cam.z=1.1;
  for(let i=0;i<40;i++){trySpawnTraffic(true);trySpawnPed(true);}
}
function note(t){S.notes.push({t,life:6});if(S.notes.length>4)S.notes.shift();}
function banner(a,b,col){S.banner={a,b,col:col||'#ffe36b',life:4.5};}

/* ---------------- entities ---------------- */
function mkCar(type,x,y,ang){
  const c={type,x,y,ang,v:0,hp:CT[type].hp,col:type==='police'?'#f2f2f6':type==='taxi'?'#f4c20d':pick(CARCOL),
    ai:null,cop:false,dead:false,mission:false,burn:0,brake:false};
  cars.push(c);return c;
}
function mkPed(kind,x,y){
  const p={kind,x,y,ang:rnd(0,6.28),d:Math.random()*4|0,hp:kind==='civ'?40:kind==='cop'?75:60,
    col:kind==='cop'?'#27407f':kind==='gang'?'#7a2bd6':pick(SHIRT),skin:pick(SKIN),
    walk:rnd(0,6),panic:0,cool:rnd(.8,1.8),seed:rnd(0,9),sideT:0,side:0,dead:false,deadT:0,leave:6};
  peds.push(p);return p;
}
function spark(x,y,col,n,sp){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.2,.6),max:.6,col,size:rnd(2,4)});}}
function viewR(){const z=Math.min(W,H)/760*cam.z;return Math.hypot(W,H)/2/z;}

function trySpawnTraffic(near){
  const vr=near?260:viewR()+90;
  for(let k=0;k<8;k++){
    const i=Math.random()*8|0,j=Math.random()*8|0,d=Math.random()*4|0;
    if(!validDir(i,j,d))continue;
    const[x,y]=exitPt(i,j,d),dd=Math.hypot(x-P.x,y-P.y);
    if(dd<vr||dd>vr+(near?1500:750))continue;
    if(cars.some(c=>Math.hypot(c.x-x,c.y-y)<110))continue;
    const r=Math.random(),c=mkCar(r<.12?'sports':r<.26?'van':r<.4?'taxi':r<.45?'police':'sedan',x,y,d*Math.PI/2);
    c.ai={i,j,d,phase:0,wx:x+DX[d]*20,wy:y+DY[d]*20,stuck:0,direct:false};c.v=100;return c;
  }
  return null;
}
function trySpawnPed(near){
  const vr=near?150:viewR()+50;
  for(let k=0;k<10;k++){
    const a=rnd(0,6.28),r=vr+rnd(0,near?1200:420),x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r,t=tile(Math.floor(x/T),Math.floor(y/T));
    if(t===WALK||t===PARK||t===SAND)return mkPed('civ',x,y);
  }
  return null;
}
function spawnCopCar(){
  const vr=viewR()+60;let best=null;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const x=(i*10+1)*T,y=(j*10+1)*T,d=Math.hypot(x-P.x,y-P.y);
    if(d>vr&&d<vr+900&&(!best||Math.random()<.4))best={i,j,x,y};
  }
  if(!best)return;
  const c=mkCar('police',best.x,best.y,Math.atan2(P.y-best.y,P.x-best.x));
  c.cop=true;c.ai={i:best.i,j:best.j,d:0,phase:1,wx:best.x,wy:best.y,stuck:0,direct:false};
}
function reanchor(c){const a=c.ai;a.i=clamp(Math.round((c.x/T-1)/10),0,7);a.j=clamp(Math.round((c.y/T-1)/10),0,7);a.phase=1;a.wx=(a.i*10+1)*T;a.wy=(a.j*10+1)*T;a.direct=false;}
function chooseDir(c){
  const a=c.ai,chase=c.cop&&S.wanted>0,back=(a.d+2)%4;
  let o=[0,1,2,3].filter(d=>validDir(a.i,a.j,d)&&(chase||d!==back));
  if(!o.length)o=[back];
  if(chase){const sc=d=>Math.hypot(((a.i+DX[d])*10+1)*T-P.x,((a.j+DY[d])*10+1)*T-P.y);o.sort((p,q)=>sc(p)-sc(q));return o[0];}
  if(o.includes(a.d)&&Math.random()<.55)return a.d;
  return pick(o);
}
function dismount(c){
  c.ai=null;c.v*=.3;
  for(const s of[1,-1]){const x=c.x+Math.cos(c.ang+s*1.57)*28,y=c.y+Math.sin(c.ang+s*1.57)*28;
    if(!blocked(x,y,10))mkPed('cop',x,y);}
}

/* ---------------- crime & wanted ---------------- */
const HEAT=[0,1,3,6,10,16];
function crime(p){
  S.heat+=p;let w=0;for(let i=1;i<6;i++)if(S.heat>=HEAT[i])w=i;
  if(w>S.wanted){S.wanted=w;S.copT=0;snd(700,.25,'sawtooth',.05,400);}
  if(S.wanted>0)S.unseen=0;
}
function setWanted(l){S.heat=HEAT[l];S.wanted=l;S.unseen=0;S.copT=0;if(l)snd(700,.25,'sawtooth',.05,400);}
function clearWanted(){S.wanted=0;S.heat=0;S.unseen=0;S.arrestT=0;for(const p of peds)if(p.kind==='cop')p.leave=5;}
function updWanted(dt){
  if(!S.wanted){S.heat=Math.max(0,S.heat-dt*.04);return;}
  let seen=false,arrest=false;
  for(const p of peds)if(p.kind==='cop'&&!p.dead){const d=dist(p,P);
    if(d<520&&los(p.x,p.y,P.x,P.y)){seen=true;if(d<(P.car?46:28)&&(!P.car||Math.abs(P.car.v)<25))arrest=true;}}
  if(!seen)for(const c of cars)if(c.cop&&c.ai&&!c.dead&&dist(c,P)<520&&los(c.x,c.y,P.x,P.y)){seen=true;break;}
  if(seen)S.unseen=0;else{S.unseen+=dt;if(S.unseen>8+S.wanted*3){clearWanted();note('You lost the cops.');snd(520,.3,'triangle',.06,300);}}
  if(arrest){S.arrestT+=dt;if(S.arrestT>1.4)die('busted');}else S.arrestT=Math.max(0,S.arrestT-dt);
}

/* ---------------- combat ---------------- */
function fire(x,y,a,dmg,o){bullets.push({x,y,vx:Math.cos(a)*900,vy:Math.sin(a)*900,life:.55,dmg,o});}
function hurtPed(p,dmg,ang,byPlayer){
  if(p.dead)return;
  p.hp-=dmg;spark(p.x,p.y,'#c0142a',5,90);moveEnt(p,Math.cos(ang)*6,Math.sin(ang)*6,10);
  if(p.kind==='civ')p.panic=7;
  if(byPlayer&&p.kind!=='gang')crime(p.kind==='cop'?2:.6);
  if(p.hp<=0){
    p.dead=true;p.deadT=25;p.ang=ang;
    if(byPlayer){S.stats.kills++;if(p.kind!=='gang')crime(p.kind==='cop'?3:1.4);}
    picks.push({x:p.x,y:p.y,amt:p.kind==='gang'?Math.round(rnd(80,160)):Math.round(rnd(8,60)),life:40});
  }
}
function damagePlayer(d){
  if(S.dead)return;
  if(P.armor>0){const a=Math.min(P.armor,d*.8);P.armor-=a;d-=a;}
  P.hp-=d;S.hit=.35;
  if(P.hp<=0){P.hp=0;die('ko');}
}
function attack(){
  const w=WP[P.w];P.cool=w.rate;
  if(P.w===0){
    P.punch=.16;snd(140,.07,'triangle',.06,-60);
    for(const p of peds){if(p.dead)continue;
      if(dist(P,p)<38&&Math.abs(angDiff(Math.atan2(p.y-P.y,p.x-P.x),P.ang))<1.1){hurtPed(p,22,P.ang,true);break;}}
    return;
  }
  if(P.ammo[P.w]<=0){note('Out of ammo — switched to fists.');P.w=0;return;}
  P.ammo[P.w]--;
  const mx=P.x+Math.cos(P.ang)*18,my=P.y+Math.sin(P.ang)*18;
  for(let i=0;i<w.pel;i++)fire(mx,my,P.ang+rnd(-w.spread,w.spread),w.dmg,'p');
  spark(mx,my,'#ffd766',3,120);snd(P.w===3?90:P.w===2?240:180,.09,'sawtooth',.07,-80);
  let witness=false;
  for(const p of peds){if(p.dead||p.kind!=='civ')continue;const d=dist(p,P);if(d<420){p.panic=6;witness=true;}}
  if(witness)crime(.22);
}
function explode(c){
  c.dead=true;c.v=0;c.ai=null;S.shake=.5;
  spark(c.x,c.y,'#ff9a2e',26,320);spark(c.x,c.y,'#ffe36b',14,200);spark(c.x,c.y,'#333',14,120);
  snd(70,.6,'sawtooth',.12,-40);
  for(const p of peds)if(!p.dead&&dist(p,c)<120)hurtPed(p,200,Math.atan2(p.y-c.y,p.x-c.x),false);
  for(const o of cars)if(o!==c&&!o.dead&&dist(o,c)<110)o.hp-=60;
  if(P.car===c){exitCar(true);damagePlayer(75);}
  else if(dist(P,c)<120&&!P.car)damagePlayer(15+50*(1-dist(P,c)/120));
}
function die(kind){
  if(S.dead)return;
  S.dead={t:3.6,kind};
  if(P.car){P.car.ai=null;P.car=null;}
  if(kind==='busted')S.stats.busted++;else S.stats.ko++;
  snd(200,.8,'sawtooth',.08,-150);
  if(S.mission)failMission(kind==='busted'?'You were arrested.':'You were knocked out.');
}
function respawn(){
  const busted=S.dead.kind==='busted',pl=busted?PLACES[8]:PLACES[7];
  const fee=Math.min(S.money,Math.round(S.money*.1)+100);
  S.money-=fee;P.x=pl.x*T;P.y=(pl.y+1.2)*T;P.hp=100;S.dead=null;
  if(busted){P.own=[1,0,0,0];P.ammo=[0,0,0,0];P.w=0;P.armor=0;note('Released on bail. Weapons confiscated. Fee: $'+fee);}
  else note('Patched up at the hospital. Bill: $'+fee);
  clearWanted();peds=peds.filter(p=>p.kind!=='cop');cars=cars.filter(c=>!c.cop);bullets=[];
  S.tod=(S.tod+6)%24;cam.x=P.x;cam.y=P.y;save();
}

/* ---------------- player ---------------- */
function mouseWorld(){const z=Math.min(W,H)/760*cam.z;return{x:(mouse.x-W/2)/z+cam.x,y:(mouse.y-H/2)/z+cam.y};}
function nearCar(){let b=null,bd=54;for(const c of cars){if(c.dead||c.hp<=0)continue;const d=dist(c,P);if(d<bd){bd=d;b=c;}}return b;}
function enterCar(){
  const c=nearCar();if(!c)return;
  if(c.ai){
    if(c.cop){crime(2);dismount(c);}
    else{crime(1);const d=mkPed('civ',c.x+Math.cos(c.ang+1.57)*30,c.y+Math.sin(c.ang+1.57)*30);d.panic=9;if(blocked(d.x,d.y,10)){d.x=c.x;d.y=c.y;}}
    S.stats.stolen++;
  }else if(!c.mission&&!c.owned){S.stats.stolen++;}
  c.ai=null;c.owned=true;P.car=c;snd(160,.12,'square',.05,120);
}
function exitCar(force){
  const c=P.car;if(!c)return;
  if(!force&&Math.abs(c.v)>200){note('Slow down to bail out.');return;}
  for(const s of[1,-1,2]){const a=c.ang+(s===2?Math.PI:s*1.57),x=c.x+Math.cos(a)*32,y=c.y+Math.sin(a)*32;
    if(!blocked(x,y,P.r)||(force&&s===2)){P.x=x;P.y=y;P.car=null;return;}}
  if(force){P.car=null;}
}
function updPlayer(dt){
  P.cool-=dt;P.punch-=dt;
  const up=keys.w||keys.arrowup,dn=keys.s||keys.arrowdown,lf=keys.a||keys.arrowleft,rt=keys.d||keys.arrowright;
  if(P.car){
    const c=P.car,t=CT[c.type],thr=(up?1:0)-(dn?1:0),st=(rt?1:0)-(lf?1:0);
    c.brake=false;
    if(c.hp>0){
      if(thr>0)c.v+=t.acc*dt;
      else if(thr<0){c.v-=(c.v>0?t.acc*1.7:t.acc*.6)*dt;c.brake=c.v>0;}
      else c.v-=Math.sign(c.v)*Math.min(Math.abs(c.v),110*dt);
    }else c.v*=Math.pow(.3,dt);
    if(keys[' ']){c.v-=Math.sign(c.v)*Math.min(Math.abs(c.v),520*dt);c.brake=true;}
    const tt=tile(Math.floor(c.x/T),Math.floor(c.y/T)),grip=(tt===SAND||tt===PARK)?.7:1;
    c.v=clamp(c.v,-t.max*.35,t.max*grip);
    c.ang+=st*2.7*dt*clamp(c.v/150,-1,1);
    S.stats.dist+=Math.abs(c.v)*dt;
  }else{
    const dx=(rt?1:0)-(lf?1:0),dy=(dn?1:0)-(up?1:0);
    if(dx||dy){const l=Math.hypot(dx,dy),sp=keys.shift?235:150;moveEnt(P,dx/l*sp*dt,dy/l*sp*dt,P.r);P.walk+=dt*sp/13;S.stats.dist+=sp*dt;}
    const m=mouseWorld();P.ang=Math.atan2(m.y-P.y,m.x-P.x);
    if(mouse.down&&P.cool<=0)attack();
  }
}

/* ---------------- cars ---------------- */
function aiDrive(c,dt){
  const a=c.ai,chase=c.cop&&S.wanted>0;
  let tx=a.wx,ty=a.wy,maxV=a.phase?150:95;
  if(chase){
    maxV=a.phase?340:160;
    const d=dist(c,P);
    if(d<280&&los(c.x,c.y,P.x,P.y)){
      a.direct=true;tx=P.x;ty=P.y;maxV=320;
      if(d<115&&(!P.car||Math.abs(P.car.v)<70)){dismount(c);return;}
    }else if(a.direct)reanchor(c);
  }else if(a.direct)reanchor(c);
  const df=angDiff(Math.atan2(ty-c.y,tx-c.x),c.ang);
  c.ang+=clamp(df,-3.6*dt,3.6*dt);
  let tv=maxV*(Math.abs(df)>.6?.5:1),block=false;
  if(!a.direct){
    const cx=Math.cos(c.ang),cy=Math.sin(c.ang);
    for(const o of cars){if(o===c||o.dead)continue;const dx=o.x-c.x,dy=o.y-c.y,d=Math.hypot(dx,dy);
      if(d<78&&(dx*cx+dy*cy)/d>.75){block=true;break;}}
    if(!block&&!P.car&&!chase){const dx=P.x-c.x,dy=P.y-c.y,d=Math.hypot(dx,dy);if(d<64&&(dx*cx+dy*cy)/d>.7)block=true;}
  }
  if(block){a.stuck+=dt;tv=a.stuck>5?70:0;if(a.stuck>7)a.stuck=0;}else a.stuck=Math.max(0,a.stuck-dt);
  c.brake=tv<c.v-20;
  c.v+=clamp(tv-c.v,-420*dt,(chase?330:200)*dt);
  if(!a.direct&&Math.hypot(a.wx-c.x,a.wy-c.y)<36){
    if(a.phase===0){a.i+=DX[a.d];a.j+=DY[a.d];a.phase=1;[a.wx,a.wy]=entryPt(a.i,a.j,a.d);}
    else{a.d=chooseDir(c);a.phase=0;[a.wx,a.wy]=exitPt(a.i,a.j,a.d);}
  }
}
function updCars(dt){
  for(const c of cars){
    if(c.dead)continue;
    if(c.hp<=0){c.burn+=dt;if(Math.random()<.5)parts.push({x:c.x+rnd(-8,8),y:c.y+rnd(-8,8),vx:rnd(-15,15),vy:rnd(-50,-20),life:.8,max:.8,col:Math.random()<.5?'#ff8a2e':'#444',size:rnd(4,8)});
      if(c.burn>3.5){explode(c);continue;}}
    if(c!==P.car){if(c.ai&&c.hp>0)aiDrive(c,dt);else{c.v*=Math.pow(.15,dt);c.brake=false;}}
    const sp=Math.abs(c.v);
    if(sp>1){
      const hit=moveEnt(c,Math.cos(c.ang)*c.v*dt,Math.sin(c.ang)*c.v*dt,15);
      if(hit){if(sp>150){c.hp-=sp/28;c.v*=-.3;spark(c.x+Math.cos(c.ang)*20,c.y+Math.sin(c.ang)*20,'#ffd766',5,140);if(c===P.car){S.shake=.2;snd(90,.15,'square',.07,-30);}}else c.v*=.92;}
    }
  }
  // car vs car
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){
    const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<34&&d>.01){
      const nx=dx/d,ny=dy/d,o=(34-d)/2,rel=Math.abs(a.v)+Math.abs(b.v);
      moveEnt(a,-nx*o,-ny*o,15);moveEnt(b,nx*o,ny*o,15);
      if(rel>160){const dm=rel/40;if(!a.dead)a.hp-=dm;if(!b.dead)b.hp-=dm;spark((a.x+b.x)/2,(a.y+b.y)/2,'#ffd766',4,130);
        if(a===P.car||b===P.car){S.shake=.25;snd(100,.15,'square',.07,-30);const o2=a===P.car?b:a;if(o2.cop&&o2.ai)crime(.3);}}
      a.v*=.6;b.v*=.6;
    }
  }
  // car vs people
  for(const c of cars){
    const sp=Math.abs(c.v);
    for(const p of peds){if(p.dead)continue;const d=dist(c,p);
      if(d<23){if(sp>80&&!c.dead)hurtPed(p,sp/3,c.ang,c===P.car);else if(d>.1){p.x+=(p.x-c.x)/d*(23-d);p.y+=(p.y-c.y)/d*(23-d);}}}
    if(!P.car&&!S.dead){const d=dist(c,P);
      if(d<25&&d>.1){const nx=(P.x-c.x)/d,ny=(P.y-c.y)/d;moveEnt(P,nx*(25-d),ny*(25-d),P.r);
        if(sp>90&&!c.dead){damagePlayer(sp/9);moveEnt(P,nx*14,ny*14,P.r);}}}
  }
  if(P.car){P.x=P.car.x;P.y=P.car.y;P.ang=P.car.ang;}
}

/* ---------------- peds ---------------- */
function updPeds(dt){
  for(const p of peds){
    if(p.dead){p.deadT-=dt;continue;}
    if(p.kind==='civ'||(p.kind==='cop'&&S.wanted===0)){
      if(p.kind==='cop')p.leave-=dt;
      if(p.panic>0){
        p.panic-=dt;p.ang=Math.atan2(p.y-P.y,p.x-P.x)+Math.sin(S.t*3+p.seed)*.6;
        moveEnt(p,Math.cos(p.ang)*165*dt,Math.sin(p.ang)*165*dt,10);p.walk+=dt*14;
      }else{
        const tt=tile(Math.floor((p.x+DX[p.d]*22)/T),Math.floor((p.y+DY[p.d]*22)/T));
        if(!(tt===WALK||tt===SAND||tt===PARK||tt===LOT)||Math.random()<.15*dt)p.d=Math.random()*4|0;
        else{p.x+=DX[p.d]*46*dt;p.y+=DY[p.d]*46*dt;}
        p.ang=p.d*Math.PI/2;p.walk+=dt*5;
      }
      continue;
    }
    // hostile: cop (wanted) or gang
    const d=dist(p,P),see=d<470&&los(p.x,p.y,P.x,P.y);
    if(p.kind==='gang'&&d>700)continue;
    p.ang=Math.atan2(P.y-p.y,P.x-p.x);
    const keep=(p.kind==='cop'&&S.wanted<2)?0:150;
    if(d>keep+10||!see){
      let a=p.ang;if(p.sideT>0){p.sideT-=dt;a+=p.side;}
      const sp=p.kind==='cop'?140:108;
      if(d>20){const hit=moveEnt(p,Math.cos(a)*sp*dt,Math.sin(a)*sp*dt,10);
        if(hit&&p.sideT<=0){p.sideT=.7;p.side=(Math.random()<.5?1:-1)*1.4;}
        p.walk+=dt*11;}
    }
    p.cool-=dt;
    if(see&&p.cool<=0&&!S.dead&&(p.kind==='gang'||S.wanted>=2)){
      fire(p.x+Math.cos(p.ang)*16,p.y+Math.sin(p.ang)*16,p.ang+rnd(-.11,.11),7,'e');
      p.cool=rnd(.6,1.4);snd(170,.07,'sawtooth',.03,-70);
    }
  }
}
function updBullets(dt){
  for(const b of bullets){
    for(let s=0;s<2&&b.life>0;s++){
      b.x+=b.vx*dt/2;b.y+=b.vy*dt/2;
      if(tile(Math.floor(b.x/T),Math.floor(b.y/T))===BLD){b.life=0;spark(b.x,b.y,'#ddd',2,80);break;}
      if(b.o==='p'){
        for(const p of peds)if(!p.dead&&Math.hypot(p.x-b.x,p.y-b.y)<13){hurtPed(p,b.dmg,Math.atan2(b.vy,b.vx),true);b.life=0;break;}
        if(b.life>0)for(const c of cars)if(c!==P.car&&!c.dead&&Math.hypot(c.x-b.x,c.y-b.y)<19){c.hp-=b.dmg*.6;spark(b.x,b.y,'#ffd766',2,90);b.life=0;if(c.cop&&c.ai)crime(.5);break;}
      }else if(!S.dead){
        if(P.car){if(Math.hypot(P.car.x-b.x,P.car.y-b.y)<20){P.car.hp-=b.dmg*.8;spark(b.x,b.y,'#ffd766',2,90);b.life=0;}}
        else if(Math.hypot(P.x-b.x,P.y-b.y)<13){damagePlayer(b.dmg);b.life=0;}
      }
    }
    b.life-=dt;
  }
  bullets=bullets.filter(b=>b.life>0);
}
function updParts(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life-=dt;}parts=parts.filter(p=>p.life>0);}

/* ---------------- missions ---------------- */
function spawnGang(x,y,n,far){
  const m=S.mission;
  for(let k=0;k<n;k++)for(let tr=0;tr<40;tr++){
    const a=rnd(0,6.28),r=far?rnd(380,560):rnd(40,230),px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
    if(!blocked(px,py,12)){const g=mkPed('gang',px,py);m.ents.push(g);break;}
  }
}
function startMission(i){
  const def=MISSIONS[i];
  S.mission={def,idx:-1,ents:[],car:null,timer:0,hasTimer:false,target:null,text:'',waveT:0};
  banner(def.name,'Mission '+(i+1)+' of '+MISSIONS.length+'  ·  '+def.giver,'#22e6ff');note(def.intro);snd(440,.3,'triangle',.07,440);
  nextStep();
}
function nextStep(){
  const m=S.mission;m.idx++;m.target=null;m.hasTimer=false;
  if(m.idx>=m.def.steps.length)return passMission();
  const s=m.def.steps[m.idx];if(s.text)m.text=s.text;
  if(s.time){m.timer=s.time;m.hasTimer=true;}
  if(s.t==='give'){P.own[s.w]=1;P.ammo[s.w]+=s.ammo;P.w=s.w;if(s.armor)P.armor=100;note('Received: '+WP[s.w].n+(s.armor?' + body armor':''));return nextStep();}
  if(s.t==='wanted'){setWanted(s.lv);return nextStep();}
  if(s.t==='lose'){if(S.wanted===0)return nextStep();return;}
  if(s.t==='car'){const c=mkCar(s.type,s.at[0]*T,s.at[1]*T,0);c.mission=true;if(s.type==='sports')c.col='#ffd21f';m.car=c;m.target={x:c.x,y:c.y};return;}
  if(s.t==='goto'){m.target={x:s.at[0]*T,y:s.at[1]*T};return;}
  if(s.t==='kill'){spawnGang(s.at[0]*T,s.at[1]*T,s.n);m.target={x:s.at[0]*T,y:s.at[1]*T};return;}
  if(s.t==='survive'){m.waveT=1;}
}
function cleanupMission(){
  const m=S.mission;if(!m)return;
  for(const e of m.ents)if(!e.dead)e.gone=true;
  peds=peds.filter(p=>!p.gone);
  if(m.car)m.car.mission=false;
  S.mission=null;
}
function passMission(){
  const m=S.mission,r=m.def.reward;
  S.money+=r;S.done++;cleanupMission();
  banner('MISSION PASSED','+$'+r.toLocaleString());snd(523,.15,'square',.06);setTimeout(()=>snd(784,.3,'square',.06),150);
  if(S.done>=MISSIONS.length)S.endT=5;
  save();
}
function failMission(why){cleanupMission();banner('MISSION FAILED',why,'#ff4a5c');snd(220,.5,'sawtooth',.06,-120);}
function updMission(dt){
  const m=S.mission;
  if(!m){
    if(S.done<MISSIONS.length&&!S.dead){const d=MISSIONS[S.done];
      if(Math.hypot(P.x-d.start[0]*T,P.y-d.start[1]*T)<46&&(!P.car||Math.abs(P.car.v)<60)){
        if(S.wanted===0)startMission(S.done);else S.prompt='Lose the cops before starting a job';}}
    return;
  }
  const s=m.def.steps[m.idx];
  if(m.hasTimer){m.timer-=dt;if(m.timer<=0){if(s.t==='survive')return nextStep();return failMission('You ran out of time.');}}
  if(m.car&&m.car.dead)return failMission('The car was destroyed.');
  if(s.t==='car'){m.target.x=m.car.x;m.target.y=m.car.y;if(P.car===m.car)nextStep();}
  else if(s.t==='goto'){
    if(s.mcar&&P.car!==m.car){m.target.x=m.car.x;m.target.y=m.car.y;m.sub='Get back in the car';}
    else{m.sub='';m.target.x=s.at[0]*T;m.target.y=s.at[1]*T;
      if(dist(P,m.target)<54&&(!s.car||P.car)&&(!s.stop||!P.car||Math.abs(P.car.v)<150)){snd(880,.12,'square',.05);nextStep();}}
  }
  else if(s.t==='kill'){
    let n=0,best=null,bd=1e9;for(const e of m.ents)if(!e.dead){n++;const d=dist(e,P);if(d<bd){bd=d;best=e;}}
    if(!n)nextStep();else{m.sub=n+' left';m.target={x:best.x,y:best.y};}
  }
  else if(s.t==='survive'){m.sub='';m.waveT-=dt;if(m.waveT<=0){m.waveT=5.5;spawnGang(P.x,P.y,2,true);}}
  else if(s.t==='lose'){if(S.wanted===0)nextStep();}
}

/* ---------------- world: places, pickups, spawner ---------------- */
function nearPlace(){for(const p of PLACES)if(Math.hypot(P.x-p.x*T,P.y-p.y*T)<56)return p;return null;}

  else if(p.k==='safe'){if(S.wanted>0){note('Too hot — lose the cops first.');return;}P.hp=100;S.tod=(S.tod+8)%24;save();note('Game saved. You feel rested.');snd(520,.25,'triangle',.06,260);}
}
function updWorld(dt){
  S.prompt='';
  const pl=nearPlace();
  if(pl){
    if(pl.k==='spray'){
      S.prompt=pl.n;S.sprayT-=dt;

function spawner(dt){

  if(S.dead){S.dead.t-=dt;updCars(dt);updPeds(dt);updParts(dt);if(S.dead.t<=0)respawn();return;}

    ctx.font=(15*u)+'px '+F;const w=Math.min(ctx.measureText(n.t).width+24*u,W*.6);
    ctx.fillStyle='rgba(9,7,22,.78)';ctx.fillRect(18*u,ny-13*u,w,26*u);ctx.fillStyle='#ff2bd6';ctx.fillRect(18*u,ny-13*u,3*u,26*u);
    ctx.fillStyle='#f3eefc';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(n.t,30*u,ny,W*.6-24*u);ny+=31*u;}
  ctx.globalAlpha=1;
  // radar
  const R=92*u,cx=24*u+R,cy=H-24*u-R,k=1.6*u,f=k/16;
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();ctx.fillStyle='#0e5a80';ctx.fillRect(cx-R,cy-R,R*2,R*2);
  ctx.drawImage(mm,cx-P.x*f,cy-P.y*f,mm.width*k,mm.height*k);ctx.restore();
  ctx.strokeStyle='rgba(255,43,214,.9)';ctx.lineWidth=3*u;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  blips((wx,wy,col,l,r)=>{let dx=(wx-P.x)*f,dy=(wy-P.y)*f;const d=Math.hypot(dx,dy);if(d>R-6){dx*=(R-6)/d;dy*=(R-6)/d;}
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx+dx,cy+dy,(l?r+3:r)*u,0,7);ctx.fill();
    if(l){ctx.fillStyle='#0a0814';ctx.font='bold '+(10*u)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l,cx+dx,cy+dy+.5);}});
  ctx.save();ctx.translate(cx,cy);ctx.rotate(P.ang);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(8*u,0);ctx.lineTo(-5*u,-5*u);ctx.lineTo(-5*u,5*u);ctx.closePath();ctx.fill();ctx.restore();
  // mission text
  const m=S.mission;
  if(m){txt(m.text+(m.sub?'  —  '+m.sub:''),W/2,H-54*u,'bold '+(21*u)+'px '+F,'#ffe36b','center');
    if(m.hasTimer){const tl=Math.max(0,m.timer);txt(Math.floor(tl/60)+':'+String(Math.floor(tl%60)).padStart(2,'0'),W/2,44*u,(44*u)+'px '+I,tl<8?'#ff4a5c':'#fff','center');}}
  else if(S.done<MISSIONS.length)txt('Follow the pink M to your next job: '+MISSIONS[S.done].name,W/2,H-54*u,(17*u)+'px '+F,'rgba(255,255,255,.8)','center');
  else txt('Story complete — the coast is yours. Free roam!',W/2,H-54*u,(17*u)+'px '+F,'rgba(255,255,255,.8)','center');
  if(S.prompt)txt(S.prompt,W/2,H-90*u,'bold '+(18*u)+'px '+F,'#fff','center');
  if(S.arrestT>.2)txt('HANDS UP!',W/2,H*.3,(40*u)+'px '+I,'#6aa0ff','center');
  txt('Tokens '+S.tokens.length+'/'+TOKENS.length+'   ·   a game by '+SITE,W-20*u,H-18*u,(13*u)+'px '+F,'rgba(255,255,255,.75)','right');
  // banner / death
  if(S.dead){ctx.fillStyle='rgba(0,0,0,'+Math.min(.6,(3.6-S.dead.t)*.3)+')';ctx.fillRect(0,0,W,H);
    txt(S.dead.kind==='busted'?'ARRESTED':'KNOCKED OUT',W/2,H/2,(96*u)+'px '+I,S.dead.kind==='busted'?'#6aa0ff':'#ff4a5c','center');}
  else if(S.banner){const b=S.banner;ctx.globalAlpha=clamp(b.life,0,1);
    txt(b.a,W/2,H*.3,'italic '+(70*u)+'px '+I,b.col,'center');txt(b.b,W/2,H*.3+56*u,'bold '+(22*u)+'px '+F,'#fff','center');ctx.globalAlpha=1;}
  // full map
  if(S.map){ctx.fillStyle='rgba(6,4,18,.86)';ctx.fillRect(0,0,W,H);
    const s=Math.min((W-80)/mm.width,(H-120)/mm.height),ox=(W-mm.width*s)/2,oy=(H-mm.height*s)/2+14,g=s/16;
    ctx.drawImage(mm,ox,oy,mm.width*s,mm.height*s);ctx.strokeStyle='#ff2bd6';ctx.lineWidth=3;ctx.strokeRect(ox,oy,mm.width*s,mm.height*s);
    blips((wx,wy,col,l,r)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(ox+wx*g,oy+wy*g,(l?r+5:r+1),0,7);ctx.fill();
      if(l){ctx.fillStyle='#0a0814';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l,ox+wx*g,oy+wy*g+.5);}});
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ox+P.x*g,oy+P.y*g,6,0,7);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();
    txt('NEON TIDE — CITY MAP',W/2,oy-24,'italic 30px '+I,'#ffe36b','center');
    txt('M mission  ·  H safehouse  ·  G guns  ·  T tacos  ·  S respray  ·  + hospital  ·  P police     [M] close',W/2,oy+mm.height*s+22,'14px '+F,'#d6cfe8','center');}
}

/* ---------------- menus ---------------- */
const CREDIT='<div class="credit">Game design &amp; development by <a href="https://'+SITE+'" target="_blank" rel="noopener">'+SITE+'</a></div>';
function panel(html){$('panel').innerHTML=html;$('ov').classList.remove('hide');S.paused=true;mouse.down=false;}
function closePanel(){$('ov').classList.add('hide');S.paused=false;}
function menuMain(){
  running=false;const sv=loadSave();
  panel('<h1>NEON<br>TIDE</h1><div class="tag">An open-world crime caper</div>'+
    '<button onclick="startGame(true)" '+(sv?'':'disabled')+'>Continue'+(sv?'<small>$'+Math.floor(sv.money).toLocaleString()+' · '+(sv.done||0)+'/'+MISSIONS.length+' missions</small>':'')+'</button>'+
    '<button onclick="startGame(false)">New Game</button><button onclick="menuControls(0)">Controls</button><button onclick="menuCredits(0)">Credits</button>'+CREDIT);
}
function menuControls(inGame){
  panel('<h2>Controls</h2><ul>'+
    '<li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk / drive &nbsp; <kbd>Shift</kbd> sprint</li>'+
    '<li><kbd>Mouse</kbd> aim &nbsp; <kbd>Click</kbd> punch / shoot (on foot)</li>'+
    '<li><kbd>F</kbd> enter / exit vehicle &nbsp; <kbd>Space</kbd> handbrake</li>'+
    '<li><kbd>E</kbd> use shops &amp; safehouse &nbsp; <kbd>1</kbd>–<kbd>4</kbd> or <kbd>Q</kbd> weapons</li>'+
    '<li><kbd>M</kbd> city map &nbsp; <kbd>N</kbd> mute &nbsp; <kbd>Esc</kbd> pause</li></ul>'+
    '<p>Walk into the pink <b>M</b> ring to start a job. Crime earns wanted stars — break line of sight to cool off, or drive into a Respray. Find all 14 neon tokens for a bonus. Progress saves automatically in this browser.</p>'+
    '<button onclick="'+(inGame?'pauseMenu()':'menuMain()')+'">Back</button>'+CREDIT);
}
function menuCredits(inGame){
  panel('<h2>Credits</h2><p class="big">NEON TIDE</p><p>Game design, code &amp; art direction</p>'+
    '<p class="big"><a href="https://'+SITE+'" target="_blank" rel="noopener">'+SITE+'</a></p>'+
    '<p>Built with plain HTML, CSS and JavaScript on a single canvas. No engines, no external assets — everything you see is drawn in code and saved with localStorage.</p>'+
    '<p style="margin-top:10px;font-size:13px;color:#8d85a8">An original game. All names, places and characters are fictional.</p>'+
    '<button onclick="'+(inGame?'pauseMenu()':'menuMain()')+'">Back</button>');
}
function pauseMenu(){
  const s=S.stats;
  panel('<h2>Paused</h2><p>Missions '+S.done+'/'+MISSIONS.length+' · Tokens '+S.tokens.length+'/'+TOKENS.length+' · Takedowns '+s.kills+' · Cars taken '+s.stolen+
    ' · '+(s.dist/16/1000).toFixed(1)+' km travelled · '+Math.floor(s.time/60)+' min played</p>'+
    '<button onclick="closePanel()">Resume</button><button onclick="menuControls(1)">Controls</button><button onclick="menuCredits(1)">Credits</button>'+
    '<button onclick="toggleMute();pauseMenu()">Sound: '+(mute?'Off':'On')+'</button>'+
    '<button onclick="quitToMenu()">Save &amp; quit to menu</button>'+CREDIT);
}
function shopMenu(){
  const it=(label,cost,fn,dis)=>'<button onclick="'+fn+'" '+(dis||S.money<cost?'disabled':'')+'>'+label+'<small>$'+cost+'</small></button>';
  panel('<h2>Ammo Depot</h2><p>Cash: <b style="color:#5dff9b">$'+Math.floor(S.money).toLocaleString()+'</b></p>'+
    it(P.own[1]?'Pistol rounds ×60':'Pistol + 60 rounds',P.own[1]?120:400,'buy(1)')+
    it(P.own[2]?'SMG rounds ×150':'SMG + 150 rounds',P.own[2]?300:1500,'buy(2)')+
    it(P.own[3]?'Shotgun shells ×24':'Shotgun + 24 shells',P.own[3]?200:1200,'buy(3)')+
    it('Body armor',500,'buy(9)',P.armor>=100)+
    '<button onclick="closePanel()">Leave</button>');
}
function buy(i){
  if(i===9){if(S.money<500)return;S.money-=500;P.armor=100;}
  else{const cost=P.own[i]?[0,120,300,200][i]:[0,400,1500,1200][i];if(S.money<cost)return;S.money-=cost;P.own[i]=1;P.ammo[i]+=[0,60,150,24][i];P.w=i;}
  snd(700,.1,'square',.05,300);save();shopMenu();
}
function endMenu(){
  const s=S.stats;
  panel('<h1 style="font-size:64px">THE COAST<br>IS YOURS</h1><div class="tag">Story complete</div>'+
    '<p>You pulled off the Big Score. Final cash: <b style="color:#5dff9b">$'+Math.floor(S.money).toLocaleString()+'</b> · '+Math.floor(s.time/60)+' minutes played · '+s.stolen+' cars taken.</p>'+
    '<p class="big" style="margin-top:14px">Thanks for playing!</p><p>Created by <a href="https://'+SITE+'" target="_blank" rel="noopener">'+SITE+'</a></p>'+
    '<button onclick="closePanel()">Keep roaming</button>');
}
function toggleMute(){mute=!mute;}
function quitToMenu(){if(!S.mission)save();newState(loadSave());menuMain();}
function startGame(cont){
  if(!cont&&loadSave()&&!confirm('Start a new game? Your saved progress will be overwritten.'))return;
  newState(cont?loadSave():null);running=true;closePanel();if(!cont)save();
  note(cont?'Welcome back to Neon Tide.':'Welcome to Neon Tide. Follow the pink M to find work.');
  snd(330,.2,'triangle',.06,330);
}

/* ---------------- input ---------------- */
function onKey(k){
  if(!running)return;
  if(k==='escape'||k==='p'){if(S.map){S.map=false;return;}if(S.paused)closePanel();else pauseMenu();return;}
  if(S.paused||S.dead)return;
  if(k==='f'||k==='enter'){if(P.car)exitCar(false);else enterCar();}
  else if(k==='e')interact();
  else if(k==='m')S.map=!S.map;
  else if(k==='n'){mute=!mute;note('Sound '+(mute?'off':'on'));}
  else if(k==='q'){for(let i=1;i<=4;i++){const w=(P.w+i)%4;if(P.own[w]&&(w===0||P.ammo[w]>0)){P.w=w;break;}}}
  else if(k>='1'&&k<='4'){const w=+k-1;if(P.own[w])P.w=w;}
}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(running&&['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k))e.preventDefault();
  if(!keys[k]&&!e.repeat)onKey(k);keys[k]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;});
cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
cv.addEventListener('mousedown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(e.button===0)mouse.down=true;});
addEventListener('mouseup',()=>{mouse.down=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------------- loop ---------------- */
let last=0;
function frame(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(!S.paused||!running)update(dt);
  draw();
  requestAnimationFrame(frame);
}
newState(loadSave());menuMain();requestAnimationFrame(frame);
</script>
</body>
</html>
